        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VMConflict"
        "422":
          $ref: "#/components/responses/VMUnprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /containers/{id}/snapshots/{sid}/rollback:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: "#/components/parameters/SnapshotID"
    post:
      tags: [containers]
      operationId: rollbackContainerSnapshot
      summary: Roll a jail back to a snapshot
      x-skep-permission: container:write
      x-skep-also-requires: [container:snapshot]
      description: |
        Requires `container:write` and `container:snapshot`, the same as a
        clone (ADR 0010 amendment n): a rollback destroys the jail's
        current data. Submits
        `container.snapshot.rollback`, which rolls the jail's root back.
        Only while the jail is stopped (`container_not_stopped`). A
        rollback to a snapshot that is not the latest destroys every newer
        one and is refused without `"destroy_newer": true`
        (`snapshot_not_latest`, listing them); the task result and the
        audit entry name each snapshot destroyed. A newer snapshot with
        linked clones refuses the rollback whatever the flag says
        (`snapshot_has_clones`), and so does a newer snapshot Skep did not
        take.

        `started_once` stays true after any rollback, even to a snapshot
        taken before the first start: Skep never writes into the tree of
        a jail that has run code (ADR 0010 decision 13).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SnapshotRollback"
      responses:
        "202":
          description: The task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VMConflict"
        "422":
          $ref: "#/components/responses/VMUnprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /containers/{id}/clone:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [containers]
      operationId: cloneContainer
      summary: Make a linked clone of a jail
      x-skep-permission: container:write
      x-skep-also-requires: [container:snapshot]
      description: |
        Requires `container:write` and `container:snapshot` (ADR 0010
        amendment j). Submits `container.clone`, which makes a new jail
        whose root is a ZFS clone of one snapshot of the source's root
        (decision 3). Without `snapshot_id`, the task takes a snapshot of
        the source first, named after the clone, and leaves it behind.
        The clone gets a new ID, the given name and hostname (default:
        the name), new MAC addresses, and the source's template, options,
        limits (the disk quota is set again), SSH key, NIC slots,
        bridges, and addressing. Its in-jail interfaces are `skep0`,
        `skep1`, ... as in every jail, so the copied `rc.conf` configures
        them.

        **Static addresses** (amendment k): a jail with a static address
        can be cloned only while it has never started. Once it has, every
        clone request is `container_started` (409), with or without new
        addressing. Before that, every NIC of the source with a static
        address needs new addressing in `nics`, or the clone would hold
        the source's address (`clone_addressing_required`, 422, naming the
        slots). New addressing or nameservers are written into the clone's
        `rc.conf` and `resolv.conf`, which Skep does only for a tree that
        has never run code: a clone inherits its source's `started_once`,
        and for a source that has started such a change is
        `container_started`.

        **A clone is the same guest.** Skep does not change what is inside
        the tree: the clone's `/etc/ssh` host keys and `/etc/hostid` are
        the source's. Regenerate the host keys inside the clone (for
        example `rm /etc/ssh/ssh_host_*` and restart sshd) before it shares
        a network with the source.

        While the clone exists, its origin snapshot and the source jail
        cannot be deleted (`snapshot_has_clones`). Clones stay in the
        source's pool.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContainerClone"
      responses:
        "202":
          description: The clone, not yet provisioned, and its task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContainerCreated"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VMConflict"
        "422":
          $ref: "#/components/responses/VMUnprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /cluster:
    get:
      tags: [cluster]
      operationId: getCluster
      x-skep-permission: system:read
      summary: This node's view of its cluster
      description: |
        Requires `system:read`. What this node's `skep-cluster` knows: the
        cluster ID, the members (with their key pins and whether they
        vote), the pending admissions, what removals and key rotations
        wait for, the members' clocks and the service's health. Nothing in
        it is secret. Without `skep-cluster` on this node: `503
        no_quorum`. Open to a degraded session (a login without quorum).
      responses:
        "200":
          description: The view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cluster"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ClusterNoQuorum"
  /cluster/guests:
    get:
      tags: [cluster]
      operationId: getClusterGuests
      x-skep-permission: system:read
      summary: The cluster's guest inventory
      description: |
        Requires `system:read`, `vm:read` and `container:read`. Every VM
        and jail in the replicated inventory (state `present`) with the
        node that owns it, and every name reserved by a create or clone
        under way (state `creating`, no ID). Among guests of the same kind
        and name every one but the one added first is `flagged`. Served
        without quorum and to a degraded session. Without `skep-cluster`
        on this node: `503 no_quorum`.
      responses:
        "200":
          description: The inventory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterGuestList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ClusterNoQuorum"
  /cluster/admissions:
    post:
      tags: [cluster]
      operationId: admitHost
      x-skep-permission: cluster:manage
      summary: Admit a host to the cluster
      description: |
        Requires `cluster:manage`. `request` is the line `skep-cluster
        join-request` printed on the host (at most 2 KiB). The answer is
        the admission line to paste into `skep-cluster join` there;
        compare the pin with the one the host shows on its own console
        first. This node needs a listen address (`skep-cluster listen
        -address ADDR` as root): otherwise `409 cluster_refused`. Sent
        once; never repeated by skep-api. A degraded session (a login
        without quorum) is refused before anything is sent: `503
        no_quorum`, `details.outcome` `not_written`, audited as a failure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClusterAdmitRequest"
      responses:
        "200":
          description: Admitted; the admission is pending until the host joins or it expires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterAdmission"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/ClusterRefused"
        "503":
          $ref: "#/components/responses/ClusterNoQuorum"
  /cluster/admissions/{name}:
    parameters:
      - name: name
        in: path
        required: true
        description: The admitted host's node name.
        schema:
          type: string
    delete:
      tags: [cluster]
      operationId: withdrawAdmission
      x-skep-permission: cluster:manage
      summary: Withdraw a pending admission
      description: |
        Requires `cluster:manage`. No such admission is `404 not_found`.
        A degraded session (a login without quorum) is refused before
        anything is sent: `503 no_quorum`, `details.outcome`
        `not_written`, audited as a failure.
      responses:
        "200":
          description: Withdrawn.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterWithdrawal"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ClusterRefused"
        "503":
          $ref: "#/components/responses/ClusterNoQuorum"
  /cluster/members/{name}/remove:
    parameters:
      - name: name
        in: path
        required: true
        description: The member's node name.
        schema:
          type: string
    post:
      tags: [cluster]
      operationId: removeMember
      x-skep-permission: cluster:manage
      summary: Remove a member from the cluster
      description: |
        Requires `cluster:manage`. `cluster_id` is required and must be
        the cluster's (compared on this node and again on the leader):
        otherwise `409 cluster_id_mismatch` and nothing is written (a
        node that does not know its cluster ID yet answers `503
        no_quorum`, `not_written`: not ready). When too few of the
        remaining voters answer now, `409 voters_unanswered`, naming the
        voters that did not answer, and nothing is written; the API offers
        no override. A degraded session (a login without quorum) is
        refused before anything is sent: `503 no_quorum`,
        `details.outcome` `not_written`, audited as a failure. The answer comes once the first entry of the removal is
        committed (up to about 90 s); the leader finishes the removal by
        itself. Removing the leader hands the leadership over first
        (`handed_over`); afterwards that node's API answers `503
        no_quorum`. The removed host keeps its guests running and needs
        `skep-cluster leave --wipe` before it can join again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClusterRemoveRequest"
      responses:
        "200":
          description: The removal is under way.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterRemoval"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ClusterRefused"
        "503":
          $ref: "#/components/responses/ClusterNoQuorum"
  /metrics:
    get:
      tags: [storage]
      operationId: getMetrics
      summary: Current resource use of the node
      x-skep-permission: system:read
      x-skep-also-requires: [vm:read, storage:read, container:read]
      description: |
        Requires `system:read`, `vm:read`, `storage:read`, and
        `container:read`: the values name pools, VMs, and jails. Current
        values only, with no history (ADR 0010 decision 15): the space and
        capacity of every allow-listed pool and directory pool against the
        `storage_capacity` thresholds, the datasets whose key is not
        loaded, each VM's disk use, and, while a VM runs, the CPU time and
        resident memory of its bhyve process; each jail's root dataset
        space and, while it runs on a host with RACCT enabled, its CPU,
        resident memory, process count, and descriptor-table slots as
        `rctl -u` reports them. The agent samples every 30 seconds; a
        sample older than a minute is replaced before answering.
        `observed_at` says when the values were read.
      parameters:
        - $ref: "#/components/parameters/Background"
      responses:
        "200":
          description: The latest sample.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Metrics"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /storage/media:
    get:
      tags: [storage]
      operationId: listMedia
      summary: Install media
      x-skep-permission: storage:read
      description: |
        Requires `storage:read`. The ISO files an administrator placed in
        the agent's media directory. Names only; the path is not exposed.
        There is no upload.
      parameters:
        - $ref: "#/components/parameters/Background"
      responses:
        "200":
          description: The media, ordered by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Makes a retry safe: a second request with the same key and the
        same body returns the task of the first; with a different body it
        is refused with `idempotency_key_conflict`.
      schema:
        type: string
        pattern: "^[A-Za-z0-9._:-]{1,128}$"
    VMID:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,64}$"
    SnapshotID:
      name: sid
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,64}$"
    Background:
      name: X-Skep-Background
      in: header
      required: false
      description: |
        Marks a request the client made by itself (a timer, a refetch on
        focus). Any non-empty value. The request is authenticated as any
        other, the idle timeout included, but does not extend the idle
        timeout.
      schema:
        type: string
        example: "1"
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: The token of a bearer session, from a login that asked for one.
    cookie:
      type: apiKey
      in: cookie
      name: __Host-skep_session
      description: The cookie of a cookie session. Set by the login; never readable by JavaScript.
  headers:
    RequestID:
      description: ID that correlates the response with the server logs.
      schema:
        type: string
  responses:
    VMConflict:
      description: |
        The current state of the VM or the host refuses the request:
        `vm_not_stopped`, `vm_not_provisioned`, `vm_name_taken`,
        `vm_mac_in_use`, `insufficient_space`, `insufficient_memory`, `bhyve_unavailable`,
        `port_filter_unavailable`,
        `storage_unavailable`, `vm_not_running`, `vm_start_failed`,
        `stop_timeout`, `console_busy`, `resource_busy`,
        `idempotency_key_conflict`, and for storage operations
        `storage_locked`, `snapshot_limit`, `snapshot_has_clones`,
        `snapshot_not_latest`, `snapshot_incomplete`, `snapshot_name_taken`,
        `snapshot_not_provisioned`, `disk_has_snapshots`,
        `disk_device_missing`, and for jail
        templates `template_name_taken`, `template_not_provisioned`,
        `jail_parent_insecure`, and for jails `container_name_taken`,
        `container_not_stopped`, `container_not_running`,
        `container_not_provisioned`, `container_started`,
        `container_start_failed`, `container_address_in_use`,
        `container_mac_in_use`, `container_quarantined`,
        `container_remove_failed`,
        `container_locked_memory_exhausted`, `epair_unavailable`, `rctl_unavailable`, `devfs_ruleset_conflict`,
        `port_filter_unavailable`, `port_filter_failed`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    VMUnprocessable:
      description: |
        The request names something this host does not offer:
        `engine_unsupported`, `firmware_unsupported`, `pool_not_allowed`,
        `bridge_not_allowed`, `media_not_found`,
        `storage_feature_unsupported`, and for jail templates
        `release_unsupported` (no allowlist for the host's release), and
        for jails `container_ssh_unavailable`,
        `mlock_requires_memory_limit`, `nameservers_require_nic`,
        `clone_addressing_required`, `container_mac_invalid`, `container_locked_memory_above_max`,
        `container_disk_quota_below_usage`.
        A build task can also fail with `template_script_unknown`,
        `template_trigger_left`, `template_host_changed`,
        `template_build_failed`, `template_archive_mismatch`, or
        `release_unsupported`; those are in the task, not the response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotImplemented:
      description: The request asks for a feature that does not exist yet (`not_implemented`), such as the VNC console.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidRequest:
      description: The request is malformed (`invalid_request`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ClusterRefused:
      description: |
        The cluster refused (`cluster_refused`, the message says why; for a
        node without a listen address it names `skep-cluster listen
        -address ADDR`), too few remaining voters answered
        (`voters_unanswered`), or the cluster ID given is not the
        cluster's (`cluster_id_mismatch`). Nothing was written.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ClusterNoQuorum:
      description: |
        Nothing can be committed now (`no_quorum`). `details.outcome` is
        `not_written` (no leader, skep-cluster not reachable, joining,
        removed, a degraded session on a change, …) or `unknown` (sent and no answer, or the outcome was
        not known within the cluster's limit: check GET /cluster). A
        request refused by the limit on a node without quorum also has
        `details.reason`: `no_quorum` or `degraded_session`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The resource or endpoint does not exist (`not_found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: not_found
              message: the requested resource does not exist
              request_id: bffe76d4cd48e82bd841254b
    Unauthenticated:
      description: The request carries no valid session (`unauthenticated`).
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer realm="skep"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    LastAdmin:
      description: The user is the only enabled administrator (`last_admin`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: |
        The request is not allowed (`forbidden`): the request has an
        `Origin` header that does not name this host over HTTPS, a
        cookie-authenticated request that changes something has no
        `Origin` header, or the caller's role lacks the
        permission the endpoint requires (named in `details.permission`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Too many login attempts (`rate_limited`). Nothing is locked; wait and try again.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    MethodNotAllowed:
      description: The method is not supported on this endpoint (`method_not_allowed`).
      headers:
        Allow:
          schema:
            type: string
            example: GET, HEAD
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Unexpected server error (`internal_error`). Details are in the server log only.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unavailable:
      description: |
        The host agent cannot be reached (`agent_unavailable`), is another
        build than skep-api (`agent_version_mismatch`), or the request was
        cancelled or timed out (`service_unavailable`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ByteSize:
      description: A number of bytes, or a string with a binary suffix such as "512M", "8G", "1T". Always returned as a number.
      oneOf:
        - type: integer
          format: int64
          minimum: 0
        - type: string
          pattern: "^[0-9]+[MmGgTt]?$"
    VMState:
      type: string
      enum: [unknown, stopped, starting, running, stopping, failed]
    VMConfig:
      type: object
      description: The part of a VM's configuration the database does not constrain.
      properties:
        cpu:
          type: object
          description: CPU topology shown to the guest; sockets x cores x threads must equal cpu_count.
          required: [sockets, cores, threads]
          properties:
            sockets: { type: integer, minimum: 1 }
            cores: { type: integer, minimum: 1 }
            threads: { type: integer, minimum: 1 }
        console:
          type: object
          properties:
            vnc:
              type: object
              description: Not implemented; enabling it is refused with `not_implemented`.
              properties:
                enabled: { type: boolean }
    VMDisk:
      type: object
      required: [id, slot, bus, read_only]
      properties:
        id: { type: string }
        slot: { type: integer }
        bus:
          type: string
          enum: [virtio-blk, nvme, ahci-hd, ahci-cd]
        read_only: { type: boolean }
        size_bytes: { type: integer, format: int64 }
        pool: { type: string }
        pool_type:
          type: string
          enum: [zfs, directory]
        thin: { type: boolean }
        volblocksize:
          type: integer
          description: The zvol's block size; absent in a directory pool.
        dataset:
          type: string
          description: The zvol, `<pool>/skep/vm/<vm-id>/disk<slot>`, in a ZFS pool.
        file:
          type: string
          description: |
            The disk's file in a directory pool, relative to the pool's
            directory: `skep/vm/<vm-id>/disk<slot>.img`.
        media:
          type: string
          description: The ISO file name, for install media (`ahci-cd`).
    VMNIC:
      type: object
      required: [id, slot, model, mac_address, bridge]
      properties:
        id: { type: string }
        slot: { type: integer }
        model:
          type: string
          enum: [virtio-net, e1000]
        mac_address: { type: string }
        bridge: { type: string }
        tap:
          type: string
          description: The host's tap interface, while the VM runs.
    VM:
      type: object
      required: [id, node_id, name, description, engine, cpu_count, memory_bytes, firmware, config,
        provisioned, desired_state, observed, drift, disks, nics, created_at, updated_at]
      properties:
        id: { type: string }
        node_id: { type: string }
        name: { type: string }
        description: { type: string }
        engine: { type: string, enum: [bhyve, qemu] }
        cpu_count: { type: integer }
        memory_bytes: { type: integer, format: int64 }
        firmware: { type: string, enum: [uefi, bios] }
        config:
          $ref: "#/components/schemas/VMConfig"
        provisioned:
          type: boolean
          description: True once `vm.create` has finished. A VM that is not provisioned can only be deleted.
        desired_state:
          type: string
          enum: [stopped, running]
          description: Set by start and stop. Nothing reconciles it in this release.
        observed:
          type: object
          required: [state]
          properties:
            state:
              $ref: "#/components/schemas/VMState"
            detail: { type: string }
            pid: { type: integer }
            at: { type: string, format: date-time }
        drift:
          type: boolean
          description: True when the desired and observed states disagree. Information only; nothing acts on it.
        disks:
          type: array
          items:
            $ref: "#/components/schemas/VMDisk"
        nics:
          type: array
          items:
            $ref: "#/components/schemas/VMNIC"
        cloned_from_snapshot_id:
          type: string
          description: The snapshot a linked clone was made from. A clone is the same guest as its source (hostname, SSH host keys, machine ID).
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    VMList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/VM"
        next_cursor: { type: string }
    VMCreate:
      type: object
      required: [name, cpu_count, memory]
      properties:
        name:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$"
        description: { type: string, maxLength: 1024 }
        engine:
          type: string
          enum: [bhyve, qemu]
          default: bhyve
          description: Only bhyve is implemented; qemu is refused with `engine_unsupported`.
        firmware:
          type: string
          enum: [uefi, bios]
          default: uefi
          description: bhyve boots with UEFI only; bios is refused with `firmware_unsupported`.
        cpu_count: { type: integer, minimum: 1 }
        memory:
          $ref: "#/components/schemas/ByteSize"
        config:
          $ref: "#/components/schemas/VMConfig"
        disks:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/VMDiskSpec"
        nics:
          type: array
          maxItems: 4
          items:
            type: object
            required: [bridge]
            properties:
              model:
                type: string
                enum: [virtio-net, e1000]
              mac_address:
                type: string
                description: |
                  Generated when left out. Must not be held by another
                  Skep VM or by a Skep jail (`vm_mac_in_use`, 409).
              bridge: { type: string }
    VMUpdate:
      type: object
      properties:
        description: { type: string, maxLength: 1024 }
        cpu_count: { type: integer, minimum: 1 }
        memory:
          $ref: "#/components/schemas/ByteSize"
        config:
          $ref: "#/components/schemas/VMConfig"
        media:
          type: array
          description: Replaces the attached install media; empty detaches all.
          items: { type: string }
        add_disks:
          type: array
          description: Disks to add, as at create; install media is attached with `media`.
          items:
            $ref: "#/components/schemas/VMDiskSpec"
        resize_disks:
          type: array
          description: Disks to grow. A disk never shrinks.
          items:
            $ref: "#/components/schemas/VMDiskResize"
        remove_disks:
          type: array
          description: Slots of the disks to destroy. Needs `vm:delete` as well as `vm:write`.
          items: { type: integer, minimum: 0 }
        destroy_snapshots:
          type: boolean
          description: Allow removing a disk that snapshots contain, destroying each of them whole.
    VMDiskSpec:
      type: object
      description: |
        A disk on a pool (pool and size) or install media (media, bus
        ahci-cd). In a ZFS pool the disk is a zvol; in a directory pool it
        is a raw file, created sparse, or written with zeros when `thin`
        is false so its blocks are allocated (on a ZFS file system with
        compression, zeros take little space whatever is written).
      properties:
        bus:
          type: string
          enum: [virtio-blk, nvme, ahci-hd, ahci-cd]
        size:
          $ref: "#/components/schemas/ByteSize"
        pool:
          type: string
          description: An allow-listed ZFS pool or directory pool.
        thin: { type: boolean }
        media: { type: string }
        volblocksize:
          $ref: "#/components/schemas/ByteSize"
          description: ZFS pools only; refused for a directory pool.
    VMDiskResize:
      type: object
      required: [slot, size]
      properties:
        slot: { type: integer, minimum: 0 }
        size:
          $ref: "#/components/schemas/ByteSize"
    VMAction:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [start, stop, force_stop, restart]
        timeout:
          type: integer
          minimum: 1
          maximum: 300
          description: Seconds a stop or restart waits for the guest to shut down. Default 90.
    SnapshotClone:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    Snapshot:
      type: object
      required: [id, resource_kind, resource_id, name, description, consistency, provisioned, created_at, clones]
      properties:
        id: { type: string }
        resource_kind:
          type: string
          enum: [vm, container]
        resource_id: { type: string }
        name: { type: string }
        description: { type: string }
        consistency:
          type: string
          enum: [consistent, crash_consistent]
        provisioned:
          type: boolean
          description: False while the snapshot task runs, and after it was interrupted; such a snapshot can only be deleted.
        created_at: { type: string, format: date-time }
        observed:
          type: object
          required: [exists, used_bytes]
          properties:
            exists: { type: boolean }
            used_bytes: { type: integer, format: int64 }
            at: { type: string, format: date-time }
        clones:
          type: array
          items:
            $ref: "#/components/schemas/SnapshotClone"
    SnapshotList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Snapshot"
    SnapshotCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$"
        description: { type: string, maxLength: 1024 }
    TemplateSourceState:
      type: object
      required: [available]
      properties:
        available: { type: boolean }
        reason:
          type: string
          description: Why the source cannot be used.
    TemplateSources:
      type: object
      required: [host_release, pkgbase, packages, dist]
      properties:
        host_release:
          type: string
          description: freebsd-version -k of the host, for example 15.1-RELEASE-p6.
        pkgbase:
          $ref: "#/components/schemas/TemplateSourceState"
        packages:
          type: array
          items: { type: string }
          description: storage.template_packages.
        dist:
          $ref: "#/components/schemas/TemplateSourceState"
    Template:
      type: object
      required: [id, name, pool, source, packages, provisioned, patch_differs, has_sshd, used_bytes, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        pool: { type: string }
        source: { type: string, enum: [pkgbase, dist] }
        packages:
          type: array
          items: { type: string }
        archive_sha256:
          type: string
          description: The checked SHA-256 of base.txz (dist).
        provisioned:
          type: boolean
          description: False while the build runs, and after it failed or was interrupted.
        release:
          type: string
          description: freebsd-version -u of the built userland, patch level included.
        host_release:
          type: string
          description: The host kernel's release when the template was read.
        patch_differs:
          type: boolean
          description: Same major.minor as the host, different patch level.
        has_sshd:
          type: boolean
          description: |
            Whether the built template has sshd (a regular file
            usr/sbin/sshd), by the same check that refuses an SSH key on a
            jail create with `container_ssh_unavailable` (ADR 0010
            amendment m). False while the template is not built.
        used_bytes: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
    TemplateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Template"
        next_cursor: { type: string }
    TemplateCreate:
      type: object
      additionalProperties: false
      required: [name, pool, source]
      properties:
        name:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$"
        pool:
          type: string
          description: An allow-listed ZFS pool.
        source: { type: string, enum: [pkgbase, dist] }
    TemplateCreated:
      type: object
      required: [template, task]
      properties:
        template:
          $ref: "#/components/schemas/Template"
        task:
          $ref: "#/components/schemas/Task"
    ContainerOptions:
      type: object
      additionalProperties: false
      properties:
        sysvipc:
          type: boolean
          description: Its own System V shared memory, semaphores, and message queues.
        mlock:
          type: boolean
          description: May lock memory (allow.mlock). Needs `limits.locked_memory` and RACCT (`mlock_requires_memory_limit`).
    ContainerLimits:
      type: object
      additionalProperties: false
      description: |
        A jail's resource limits (ADR 0010 decision 11, amendment j);
        absent or zero means none. All but `disk_quota` are RCTL deny
        rules on the jail, need RACCT (`rctl_unavailable` otherwise), and
        are added before any process runs in the jail and removed when it
        stops. What each does on FreeBSD 15.1, as measured on the test
        host:
      properties:
        memory:
          allOf: [{ $ref: "#/components/schemas/ByteSize" }]
          description: |
            **Soft.** RCTL `memoryuse`, the jail's resident memory, at
            least 16 MiB. FreeBSD does not refuse an allocation past it: a
            jail can hold more than the limit at once. While it is over,
            the host slowly moves its pages to the inactive queue (on the
            test host, after about 80 s, under 1 MiB/s), so they are the
            first memory reclaimed when the host is short of memory; they
            are not swapped out while the host has memory free. Use it as
            a target and for accounting, not as a cap.
        locked_memory:
          allOf: [{ $ref: "#/components/schemas/ByteSize" }]
          description: |
            RCTL `memorylocked`, the memory the jail may lock with
            mlock(2). The `mlock` option needs it. Not more than `memory`
            when both are set, and not more than the agent's
            `containers.max_locked_memory_bytes` (by default a quarter of
            physical memory), which is also the total of all running jails:
            a start that would pass it is refused with
            `container_locked_memory_exhausted` (ADR 0010 amendment o).
        cpu_percent:
          type: integer
          minimum: 0
          description: |
            RCTL `pcpu`: 100 is one CPU, at most 100 per CPU of the host
            (`containers.max_cpu_percent` in `GET /system`). Approximate:
            RACCT samples and averages, so a busy jail swings above and
            below the limit around it (on the test host, 50 gave samples
            between 28 and 74).
        max_processes:
          type: integer
          minimum: 0
          maximum: 1048576
          description: RCTL `maxproc`, the processes in the jail; a fork past it fails.
        open_files:
          type: integer
          minimum: 0
          maximum: 16777216
          description: |
            RCTL `openfiles`, at least 64. It counts descriptor-table
            slots, not open files: each process is charged the size of
            its table, which grows in steps (40, 128, 256, ... slots) and
            does not shrink, and helper processes such as Capsicum's
            casper count too. Size it well above the descriptors the
            jail's programs keep open.
        disk_quota:
          allOf: [{ $ref: "#/components/schemas/ByteSize" }]
          description: |
            ZFS `refquota` on the jail's root, at least 64 MiB; works
            without RACCT, and snapshots do not count against it. It
            includes the data the root shares with its template (about
            78 MiB for a minimal template), so the room left for the
            jail's own data is the quota less that. A create with a quota
            below the template's size, or an update to one below what the
            root already references, is refused with
            `container_disk_quota_below_usage`.
    ContainerCapabilities:
      type: object
      required: [rctl, max_cpu_percent]
      properties:
        rctl:
          type: boolean
          description: kern.racct.enable. Without it, every limit but `disk_quota` is refused with `rctl_unavailable`, and a jail that has one does not start.
        max_cpu_percent:
          type: integer
          description: 100 per CPU of the host, the bound of `cpu_percent`.
        max_locked_memory_bytes:
          type: integer
          format: int64
          readOnly: true
          description: The host's total of `locked_memory` over all running jails (`containers.max_locked_memory_bytes`, by default a quarter of physical memory). It is the limit, not the memory wired now. A reported 0 means none was configured and physical memory could not be read. A non-zero `locked_memory`, and so `options.mlock`, is refused at create, update, and start. A jail without `locked_memory` is unaffected, and a jail already running keeps its rule.
    ContainerIPv4:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: { type: string, enum: [dhcp, static] }
        address:
          type: string
          description: Static only. An IPv4 address with its prefix length, such as 192.0.2.10/24.
        gateway:
          type: string
          description: Static only, optional. Another address in the prefix; the jail's default route. One NIC at most has one.
    ContainerNIC:
      type: object
      required: [id, slot, bridge, mac_address, interface, ipv4]
      properties:
        id: { type: string, format: uuid }
        slot: { type: integer, minimum: 0, maximum: 7 }
        bridge: { type: string }
        mac_address:
          type: string
          description: The jail end's MAC address.
        interface:
          type: string
          description: The jail end's name inside the jail, skep<slot> (skep0, skep1, ...), the same for every jail and on every start; the jail's rc.conf names it.
        ipv4:
          $ref: "#/components/schemas/ContainerIPv4"
        host_interface:
          type: string
          description: The epair's host end, while the jail runs.
    ContainerNICSpec:
      type: object
      additionalProperties: false
      required: [bridge]
      properties:
        bridge:
          type: string
          description: An allow-listed bridge (network.bridges).
        mac_address:
          type: string
          description: >-
            Generated (02:xx:xx:xx:xx:xx) when left out; on an update, the
            slot keeps its MAC. A given address must be unicast, locally
            administered (the 0x02 bit of the first byte set), and not all
            zeroes (`container_mac_invalid`, 422, on create, update, and
            clone; ADR 0010 amendment n). A malformed one is
            `invalid_request`. One that another Skep jail or a Skep VM
            holds is `container_mac_in_use` (409) on create, update, and
            clone, with `held_by_kind` (`container` or `vm`),
            `held_by_id`, and `held_by_name` in the details, as at start
            (amendment u).
        ipv4:
          $ref: "#/components/schemas/ContainerIPv4"
    Container:
      type: object
      required: [id, name, hostname, template_id, template_name, pool, options, limits, nics, provisioned, started_once, desired_state, state, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        hostname: { type: string }
        template_id: { type: string, format: uuid }
        template_name: { type: string }
        pool: { type: string }
        release:
          type: string
          description: The template's userland release.
        options:
          $ref: "#/components/schemas/ContainerOptions"
        limits:
          $ref: "#/components/schemas/ContainerLimits"
        ssh_authorized_key:
          type: string
          description: Root's SSH public key, if one was given.
        nics:
          type: array
          items:
            $ref: "#/components/schemas/ContainerNIC"
        nameservers:
          type: array
          items: { type: string }
          description: Written into the jail's resolv.conf before its first start (static addressing).
        provisioned: { type: boolean }
        started_once:
          type: boolean
          description: True from the first start on; Skep then never writes into the jail's tree. A clone inherits its source's.
        cloned_from_snapshot_id:
          type: string
          format: uuid
          description: The snapshot a linked clone was made from. Deleting it, or its jail, is refused while the clone exists.
        desired_state: { type: string, enum: [stopped, running] }
        state:
          type: string
          enum: [unknown, stopped, starting, running, stopping, failed]
          description: >-
            `failed` is a quarantined jail (ADR 0010 amendment n): a start
            refused it before any of its code ran (the `/dev` guard or a
            parameter check) and removing it then failed. It stays
            `failed` whether or not the jail still exists; start, stop,
            and restart are refused with `container_quarantined`, and a
            delete or the agent's next start removes it without running
            `/etc/rc.shutdown`. `state_detail` gives both causes.
        jid: { type: integer }
        state_detail: { type: string }
        observed_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ContainerList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Container"
        next_cursor: { type: string }
    ContainerCreate:
      type: object
      additionalProperties: false
      required: [name, template_id]
      properties:
        name:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$"
        hostname:
          type: string
          maxLength: 253
          description: A DNS name. Defaults to the name.
        template_id: { type: string, format: uuid }
        options:
          $ref: "#/components/schemas/ContainerOptions"
        limits:
          $ref: "#/components/schemas/ContainerLimits"
        ssh_authorized_key:
          type: string
          maxLength: 16384
          description: One OpenSSH public key line, "type base64 [comment]", without options.
        nics:
          type: array
          maxItems: 8
          description: Slots 0, 1, ... in order. Each needs if_epair at start.
          items:
            $ref: "#/components/schemas/ContainerNICSpec"
        nameservers:
          type: array
          maxItems: 3
          description: IPv4 or IPv6 addresses for resolv.conf. Only with at least one NIC (`nameservers_require_nic`, 422) and when no NIC uses DHCP (dhclient writes resolv.conf; `invalid_request`).
          items: { type: string }
    ContainerUpdate:
      type: object
      additionalProperties: false
      properties:
        hostname: { type: string, maxLength: 253 }
        options:
          $ref: "#/components/schemas/ContainerOptions"
        limits:
          allOf: [{ $ref: "#/components/schemas/ContainerLimits" }]
          description: Replaces every limit; absent fields are removed.
        ssh_authorized_key:
          type: string
          maxLength: 16384
          description: Empty removes the key. Only before the first start.
        nics:
          type: array
          maxItems: 8
          description: Replaces every NIC; empty removes them all. After the first start only the bridge and MAC address of existing slots may change (`container_started`).
          items:
            $ref: "#/components/schemas/ContainerNICSpec"
        nameservers:
          type: array
          maxItems: 3
          description: Only before the first start. Left out, the stored list is kept, so an update that removes the last NIC of a jail with nameservers must also send an empty list (`nameservers_require_nic`, 422).
          items: { type: string }
    ContainerAction:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [start, stop, restart] }
        timeout:
          type: integer
          minimum: 1
          maximum: 300
          description: Seconds between SIGTERM and SIGKILL, for stop and restart.
    ContainerCreated:
      type: object
      required: [container, task]
      properties:
        container:
          $ref: "#/components/schemas/Container"
        task:
          $ref: "#/components/schemas/Task"
    ContainerConsoleLog:
      type: object
      required: [text, truncated]
      properties:
        text: { type: string }
        truncated: { type: boolean }
    SnapshotCreated:
      type: object
      required: [snapshot, task]
      properties:
        snapshot:
          $ref: "#/components/schemas/Snapshot"
        task:
          $ref: "#/components/schemas/Task"
    SnapshotRollback:
      type: object
      additionalProperties: false
      properties:
        destroy_newer:
          type: boolean
          description: Allow a rollback to an older snapshot, which destroys every newer one.
    ContainerClone:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$"
        hostname:
          type: string
          description: Defaults to the name.
        snapshot_id:
          type: string
          description: The snapshot of the source to clone. Without it, the task takes one first.
        nics:
          type: array
          maxItems: 8
          description: One entry per NIC of the source, in slot order. Empty fields keep the source's bridge and addressing; the MAC address is new unless given. Every NIC with a static address on the source needs new addressing here.
          items:
            $ref: "#/components/schemas/ContainerNICSpec"
        nameservers:
          type: array
          maxItems: 3
          items: { type: string }
          description: Replace the source's (static addressing only). Dropped when no NIC keeps a static address. Given for a clone without a NIC, refused with `nameservers_require_nic` (422).
    VMClone:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$"
        description: { type: string, maxLength: 1024 }
        snapshot_id:
          type: string
          description: The snapshot of the source to clone. Without it, the task takes one first.
    VMCreated:
      type: object
      required: [vm, task]
      properties:
        vm:
          $ref: "#/components/schemas/VM"
        task:
          $ref: "#/components/schemas/Task"
    StoragePool:
      type: object
      description: |
        An allow-listed pool: a ZFS pool (`storage.pools`) or a directory
        pool (`storage.directories`, ADR 0010 decision 6), whose disks are
        sparse raw files. A usable directory pool reports health `ONLINE`
        and the sizes of its file system; one that cannot be used
        (missing, a symbolic link, not `root` 0700, not on local UFS or
        ZFS) reports `UNAVAILABLE` with the reason in `error`.
      required: [name, type, capabilities, health, size_bytes, allocated_bytes, free_bytes, available_bytes]
      properties:
        name: { type: string }
        type:
          type: string
          enum: [zfs, directory]
        capabilities:
          type: object
          description: |
            What the pool's kind can do. A directory pool has none of
            these; snapshots and clones of a VM with a disk in one are
            refused with `storage_feature_unsupported`, never emulated.
          required: [snapshots, clones, quotas]
          properties:
            snapshots: { type: boolean }
            clones: { type: boolean }
            quotas: { type: boolean }
        health: { type: string }
        error: { type: string }
        size_bytes: { type: integer, format: int64 }
        allocated_bytes: { type: integer, format: int64 }
        free_bytes: { type: integer, format: int64 }
        available_bytes: { type: integer, format: int64 }
        observed_at: { type: string, format: date-time }
    DatasetOwner:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [vm, container, template, skep, unowned]
        id:
          type: string
          description: The owning resource, for vm, container, and template.
        reason:
          type: string
          description: Why the dataset is unowned.
    Dataset:
      type: object
      required: [name, pool, type, owner, used_bytes, referenced_bytes]
      properties:
        name: { type: string, description: The full ZFS name. }
        pool: { type: string }
        type:
          type: string
          enum: [filesystem, volume, snapshot]
        owner:
          $ref: "#/components/schemas/DatasetOwner"
        snapshot_id:
          type: string
          description: Set on a snapshot Skep took.
        used_bytes: { type: integer, format: int64 }
        referenced_bytes: { type: integer, format: int64 }
        volsize_bytes: { type: integer, format: int64, description: Volumes only. }
        refreservation_bytes: { type: integer, format: int64, description: Volumes only; absent for a thin volume. }
        volblocksize: { type: integer, description: Volumes only. }
        origin: { type: string, description: The snapshot a linked clone was made from. }
        clones:
          type: array
          description: On a snapshot, the datasets cloned from it.
          items: { type: string }
        encryption: { type: string }
        keystatus:
          type: string
          description: "`available` or `unavailable`; absent when the dataset is not encrypted."
        compression: { type: string }
        compressratio: { type: string }
    Metrics:
      type: object
      required: [node_id, observed_at, capacity_warn_percent, capacity_fail_percent, pools, vms, containers]
      properties:
        node_id: { type: string }
        observed_at: { type: string, format: date-time }
        capacity_warn_percent: { type: integer }
        capacity_fail_percent: { type: integer }
        pools:
          type: array
          items: { $ref: "#/components/schemas/PoolMetrics" }
        vms:
          type: array
          items: { $ref: "#/components/schemas/VMMetrics" }
        containers:
          type: array
          items: { $ref: "#/components/schemas/ContainerMetrics" }
    ContainerMetrics:
      type: object
      description: |
        One jail's current use. The RACCT fields are present only while
        the jail runs on a host with RACCT enabled (`System.containers.rctl`);
        the disk fields are always present.
      required: [id, name, state, disk_used_bytes, disk_referenced_bytes]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        state: { type: string }
        cpu_percent:
          type: integer
          description: RACCT `pcpu`, a recent average where 100 is one busy CPU; approximate.
        cpu_time_seconds:
          type: number
          description: CPU time of the jail's processes (RACCT `cputime`), in whole seconds.
        resident_memory_bytes:
          type: integer
          format: int64
          description: RACCT `memoryuse`, the jail's resident memory.
        processes:
          type: integer
          description: The number of processes in the jail (RACCT `maxproc`).
        open_file_slots:
          type: integer
          description: |
            RACCT `openfiles`: the descriptor-table slots of the jail's
            processes, the figure `limits.open_files` applies to. Not the
            number of open files: a table grows in steps (40, 128, 256
            slots) and never shrinks.
        disk_used_bytes:
          type: integer
          format: int64
          description: Space the jail root holds, its snapshots included.
        disk_referenced_bytes:
          type: integer
          format: int64
          description: |
            Space the jail root references, including the blocks it shares
            with its template: what `limits.disk_quota` applies to.
        error:
          type: string
          description: Which values could not be read.
    PoolMetrics:
      type: object
      required: [name, type, health, size_bytes, allocated_bytes, available_bytes, capacity_percent, capacity]
      properties:
        name: { type: string }
        type: { type: string, enum: [zfs, directory] }
        health:
          type: string
          description: What zpool(8) reports, `ONLINE` for a usable directory pool, or `UNAVAILABLE` with `error`.
        error: { type: string }
        size_bytes: { type: integer, format: int64 }
        allocated_bytes: { type: integer, format: int64 }
        available_bytes: { type: integer, format: int64 }
        capacity_percent:
          type: number
          description: |
            The share in use, to one decimal: allocated of size for a ZFS
            pool, as `zpool list` shows it; used of used plus available
            for a directory pool, as df(1) shows it.
        capacity:
          type: string
          enum: [ok, warning, failing, unavailable]
        locked_datasets:
          type: array
          items: { type: string }
          description: Datasets under the pool's dataset root whose encryption key is not loaded.
    VMMetrics:
      type: object
      required: [id, name, state, disk_used_bytes, disk_referenced_bytes, disks]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        state: { type: string }
        cpu_time_seconds:
          type: number
          description: User and system CPU time of the bhyve process, while the VM runs.
        resident_memory_bytes:
          type: integer
          format: int64
          description: Resident set of the bhyve process, while the VM runs.
        disk_used_bytes:
          type: integer
          format: int64
          description: Space the VM holds in its pools, snapshots included.
        disk_referenced_bytes:
          type: integer
          format: int64
          description: Space the VM's disks reference now.
        disks:
          type: array
          items: { $ref: "#/components/schemas/DiskMetrics" }
        error:
          type: string
          description: Which values could not be read.
    DiskMetrics:
      type: object
      required: [slot, pool, used_bytes, referenced_bytes]
      properties:
        slot: { type: integer }
        pool: { type: string }
        used_bytes: { type: integer, format: int64 }
        referenced_bytes: { type: integer, format: int64 }
    DatasetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Dataset"
        next_cursor: { type: string }
        unavailable_pools:
          type: array
          items: { type: string }
    StoragePoolList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StoragePool"
    Media:
      type: object
      required: [name, size_bytes, modified_at]
      properties:
        name: { type: string }
        size_bytes: { type: integer, format: int64 }
        modified_at: { type: string, format: date-time }
    MediaList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Media"
    EngineCapabilities:
      type: object
      description: What bhyve can do on this host now; `reason` says what is missing when it cannot run a VM.
      required: [available, reason, vmm_loaded, firmware_found, nmdm_available, max_vcpus_per_vm,
        host_memory_bytes, guest_memory_bytes, pools, bridges]
      properties:
        available: { type: boolean }
        reason: { type: string }
        simulated:
          type: boolean
          description: True on a development machine, where VMs are simulated. Never on FreeBSD.
        vmm_loaded: { type: boolean }
        firmware_found: { type: boolean }
        nmdm_available: { type: boolean }
        max_vcpus_per_vm: { type: integer }
        host_memory_bytes: { type: integer, format: int64 }
        guest_memory_bytes: { type: integer, format: int64 }
        pools:
          type: array
          items: { type: string }
        bridges:
          type: array
          items: { type: string }
    Cluster:
      type: object
      required: [cluster_id, node_id, node_name, leader_known, members, pending_admissions, health, build]
      properties:
        cluster_id: {type: string}
        node_id: {type: string}
        node_name: {type: string}
        leader_known:
          type: boolean
          description: Whether this node knows a leader now.
        state_machine_stopped_at:
          type: integer
          format: int64
          description: The log index the replicated state machine stopped at (an entry this build cannot apply).
        members:
          type: array
          items:
            $ref: "#/components/schemas/ClusterMember"
        pending_admissions:
          type: array
          items:
            $ref: "#/components/schemas/ClusterPending"
        removals:
          type: array
          description: Per member being removed, what its removal waits for.
          items: {type: string}
        rotations:
          type: array
          description: Per member rotating its key, what the rotation waits for.
          items: {type: string}
        unapplied_removal:
          type: array
          description: Members that have not applied the last removal yet.
          items: {type: string}
        clocks:
          type: array
          items:
            $ref: "#/components/schemas/ClusterClock"
        health:
          $ref: "#/components/schemas/Health"
        joining:
          type: object
          required: [phase, cluster_id]
          properties:
            phase: {type: string}
            cluster_id: {type: string}
            message: {type: string}
        removed:
          type: object
          required: [cluster_id, at, how]
          properties:
            cluster_id: {type: string}
            at: {type: string}
            how: {type: string}
        build: {type: string}
    ClusterMember:
      type: object
      required: [id, name, state, address, pin, voter]
      properties:
        id: {type: string}
        name: {type: string}
        state:
          type: string
          description: member, joining or removing.
        address:
          type: string
          description: The node-to-node address, or "" for a node without a listener.
        pin:
          type: string
          description: The SHA-256 pin of the member's node key.
        next_pin:
          type: string
          description: Set while the member rotates its key.
        voter: {type: boolean}
    ClusterPending:
      type: object
      required: [node_id, name, address, pin, expires_at]
      properties:
        node_id: {type: string}
        name: {type: string}
        address: {type: string}
        pin: {type: string}
        expires_at: {type: string, format: date-time}
    ClusterClock:
      type: object
      required: [node_id, name, known]
      properties:
        node_id: {type: string}
        name: {type: string}
        known: {type: boolean}
        offset_ms: {type: integer, format: int64}
        uncertainty_ms: {type: integer, format: int64}
        round_trip_ms: {type: integer, format: int64}
        note: {type: string}
    ClusterAdmitRequest:
      type: object
      required: [request]
      additionalProperties: false
      properties:
        request:
          type: string
          maxLength: 2048
          description: The line "skep-cluster join-request" printed on the host.
    ClusterAdmission:
      type: object
      required: [admission, cluster_id, node_id, name, address, pin, expires_at, op_id]
      properties:
        admission:
          type: string
          description: The line to paste into "skep-cluster join" on the host.
        cluster_id: {type: string}
        node_id: {type: string}
        name: {type: string}
        address: {type: string}
        pin: {type: string}
        expires_at: {type: string, format: date-time}
        op_id: {type: string}
    ClusterWithdrawal:
      type: object
      required: [node_id, name, op_id]
      properties:
        node_id: {type: string}
        name: {type: string}
        op_id: {type: string}
    ClusterRemoveRequest:
      type: object
      required: [cluster_id]
      additionalProperties: false
      properties:
        cluster_id:
          type: string
          description: The cluster's ID, typed back (GET /cluster).
    ClusterRemoval:
      type: object
      required: [node_id, name, cluster_id, op_id, handed_over]
      properties:
        node_id: {type: string}
        name: {type: string}
        cluster_id: {type: string}
        op_id: {type: string}
        handed_over:
          type: boolean
          description: The member was the leader and handed the leadership over first.
    ClusterGuest:
      type: object
      required: [name, kind, owner, state, flagged, time]
      properties:
        id:
          type: string
          description: The guest's ID; absent for a reservation.
        name: {type: string}
        kind:
          type: string
          enum: [vm, container]
        owner:
          type: object
          required: [node_id, node_name]
          properties:
            node_id: {type: string}
            node_name: {type: string}
        state:
          type: string
          enum: [creating, present]
        flagged:
          type: boolean
          description: Another guest of the same kind and name was added first.
        task_id:
          type: string
          description: The create or clone task, where it is known.
        time:
          type: string
          format: date-time
          description: When the entry was written, by the cluster leader's clock.
    ClusterGuestList:
      type: object
      required: [cluster_id, guests_index, items]
      properties:
        cluster_id: {type: string}
        guests_index:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: "#/components/schemas/ClusterGuest"
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                Stable, machine-readable error code. `resource_busy`,
                `idempotency_key_conflict`, and `queue_full` are returned
                by task submission, which is not exposed yet.
              enum:
                - invalid_request
                - not_found
                - method_not_allowed
                - internal_error
                - service_unavailable
                - agent_unavailable
                - agent_version_mismatch
                - unauthenticated
                - invalid_credentials
                - forbidden
                - rate_limited
                - setup_required
                - username_taken
                - last_admin
                - unknown_role
                - no_quorum
                - users_import_pending
                - too_many_users
                - cluster_refused
                - voters_unanswered
                - cluster_id_mismatch
                - resource_busy
                - idempotency_key_conflict
                - not_cancellable
                - queue_full
                - shutting_down
                - node_draining
                - too_many_guests
            message:
              type: string
              description: Human-readable description.
            request_id:
              type: string
            details:
              type: object
              additionalProperties: true
              description: Optional structured context.
    TaskStatus:
      type: string
      enum: [pending, running, succeeded, failed, cancelled, interrupted]
      description: |
        `succeeded`, `failed`, `cancelled`, and `interrupted` are terminal:
        a task in one of them never changes again. `interrupted` means the
        agent stopped or restarted before the task finished. Interrupted
        tasks are never resumed.
    Task:
      type: object
      required: [id, node_id, type, status, actor, cancellable, created_at]
      properties:
        id: { type: string }
        node_id: { type: string }
        type:
          type: string
          example: discovery.refresh
        status:
          $ref: "#/components/schemas/TaskStatus"
        resource_type:
          type: string
          description: The kind of resource the task operates on.
        resource_id: { type: string }
        actor:
          type: object
          required: [id, name]
          description: |
            Who the task was requested for. Tasks the agent starts itself
            have the actor `system`.
          properties:
            id: { type: string }
            name: { type: string }
        request_id: { type: string }
        cancellable:
          type: boolean
          description: Whether this task can be cancelled while it is running.
        cancel_requested_at:
          type: string
          format: date-time
        result:
          description: |
            Result of a succeeded task. Only returned by the single-task
            endpoint.
        error:
          type: object
          required: [code, message]
          description: Present when the task did not succeed.
          properties:
            code:
              type: string
              example: timeout
            message: { type: string }
            details:
              type: object
              additionalProperties: true
              description: >-
                Structured context the agent recorded with the failure, for
                example `dataset`, `reason` and `command` for
                `disk_device_missing`. Only the keys reviewed for each error
                code are included (the list is in the security overview);
                a key that could hold a secret, a key path, a password, or
                free text from a command or package is never included.
                Visible to every caller who can read the task. Absent when
                there is none.
              example:
                dataset: tank/skep/vm/0193.../disk0
                reason: volmode_none
                volmode: none
                command: zfs set volmode=dev tank/skep/vm/0193.../disk0
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
    TaskEvent:
      type: object
      required: [id, kind, level, message, created_at]
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum: [state, progress]
          description: |
            `state` events record state changes. `progress` events are
            messages from the task while it runs.
        level:
          type: string
          enum: [debug, info, warn, error]
        message: { type: string }
        data:
          description: Optional structured context.
        created_at:
          type: string
          format: date-time
    TaskDetail:
      allOf:
        - $ref: "#/components/schemas/Task"
        - type: object
          required: [events]
          properties:
            events:
              type: array
              items:
                $ref: "#/components/schemas/TaskEvent"
    TaskList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        next_cursor:
          type: string
          description: Pass as `cursor` to get the next page. Absent on the last page.
    Capability:
      type: object
      required: [status, reason]
      properties:
        status:
          type: string
          enum: [available, unavailable, unknown]
          description: |
            `available` was verified usable, `unavailable` was verified not
            usable, `unknown` could not be determined.
        reason:
          type: string
          description: Why the capability has this status.
    HealthStatus:
      type: object
      description: What the health endpoint returns without a session.
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable]
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        session:
          type: string
          enum: [cookie, bearer]
          default: cookie
          description: |
            The kind of session to start. `cookie` sets the session cookie
            and returns no token. `bearer` returns the token in the body
            and sets no cookie.
    PasswordChange:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 12
          maxLength: 256
          description: 12 to 256 characters. There are no composition rules.
    User:
      type: object
      description: An account. The password hash is never part of it.
      required: [id, username, display_name, role, disabled, created_at, updated_at]
      properties:
        id: { type: string }
        username: { type: string }
        display_name: { type: string }
        role:
          type: string
          description: Name of the user's role.
          example: admin
        disabled: { type: boolean }
        last_login_at:
          type: string
          format: date-time
        password_changed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    NewUser:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          pattern: "^[a-z][a-z0-9._-]{0,31}$"
        display_name:
          type: string
          maxLength: 128
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 256
        role:
          type: string
          default: viewer
          description: Name of a role.
    UserUpdate:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 128
        role:
          type: string
        disabled:
          type: boolean
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 256
          description: Sets a new password and ends the user's sessions.
    Role:
      type: object
      required: [id, name, description, permissions, built_in]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        permissions:
          type: array
          description: Permission strings of the form resource:action. An asterisk means every permission.
          items:
            type: string
        built_in:
          type: boolean
          description: Built-in roles cannot be changed or deleted.
    AuditEntry:
      type: object
      required: [id, occurred_at, actor_name, action, outcome]
      properties:
        id:
          type: integer
          format: int64
        occurred_at:
          type: string
          format: date-time
        actor_id:
          type: string
          description: Absent when no known user was involved.
        actor_name:
          type: string
          description: A username, `system`, or `local:<uid>` for a command run on the host.
        action:
          type: string
          example: auth.login
        resource_type: { type: string }
        resource_id: { type: string }
        outcome:
          type: string
          enum: [success, failure, denied]
        source_ip: { type: string }
        request_id: { type: string }
        details:
          type: object
          additionalProperties: true
    SessionResponse:
      type: object
      required: [user, session, permissions]
      properties:
        user:
          $ref: "#/components/schemas/User"
        session:
          type: object
          required: [kind, created_at, expires_at, idle_timeout_seconds]
          properties:
            kind:
              type: string
              enum: [cookie, bearer]
            created_at:
              type: string
              format: date-time
            expires_at:
              type: string
              format: date-time
              description: The absolute end of the session.
            idle_timeout_seconds:
              type: integer
              format: int64
              description: How long the session survives without use.
            degraded:
              type: boolean
              description: |
                True for a session created while `skep-cluster` had no
                quorum: it ends at most one hour after the login.
        permissions:
          type: array
          description: The permission strings of the user's role. An asterisk means every permission.
          items:
            type: string
        token:
          type: string
          description: |
            The session token. Present only in the response to a login
            that asked for a bearer session. It is shown once and is not
            stored by the server, which keeps only its SHA-256.
    Health:
      type: object
      required: [status, version, uptime_seconds, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable]
          description: The worst status of the checks.
        version:
          type: string
        uptime_seconds:
          type: integer
          format: int64
        checks:
          type: object
          additionalProperties:
            type: object
            required: [status, critical]
            properties:
              status:
                type: string
                enum: [ok, degraded, unavailable]
                description: |
                  `ok`, or when the check failed, `unavailable` for a
                  critical check and `degraded` for any other.
              critical:
                type: boolean
                description: The service cannot serve requests while this check fails.
              error:
                type: string
    BuildInfo:
      type: object
      required: [version, commit, build_date, go_version, os, arch]
      properties:
        version: { type: string }
        commit: { type: string }
        build_date: { type: string }
        go_version: { type: string }
        os: { type: string }
        arch: { type: string }
    OSInfo:
      type: object
      required: [name, version, release, kernel]
      properties:
        name:
          type: string
          example: FreeBSD
        version:
          type: string
          example: "15.1"
        release:
          type: string
          example: 15.1-RELEASE-p6
        kernel:
          type: string
    Platform:
      type: string
      enum: [freebsd, linux-dev, unsupported]
      description: |
        `freebsd` is the only production platform. `linux-dev` is a
        development host and never a production host.
    System:
      type: object
      required:
        - node_id
        - hostname
        - platform
        - production_host
        - dev_mode
        - os
        - architecture
        - skep
        - capabilities
        - started_at
        - uptime_seconds
      properties:
        node_id:
          type: string
          description: Stable ID of the local node.
        hostname: { type: string }
        platform:
          $ref: "#/components/schemas/Platform"
        production_host:
          type: boolean
          description: True only on native FreeBSD outside dev mode.
        dev_mode: { type: boolean }
        os:
          $ref: "#/components/schemas/OSInfo"
        architecture: { type: string }
        skep:
          $ref: "#/components/schemas/BuildInfo"
        capabilities:
          type: object
          required: [bhyve, qemu, zfs]
          properties:
            bhyve:
              $ref: "#/components/schemas/Capability"
            qemu:
              $ref: "#/components/schemas/Capability"
            zfs:
              $ref: "#/components/schemas/Capability"
        bhyve:
          $ref: "#/components/schemas/EngineCapabilities"
        containers:
          $ref: "#/components/schemas/ContainerCapabilities"
        started_at:
          type: string
          format: date-time
        uptime_seconds:
          type: integer
          format: int64
        api:
          $ref: "#/components/schemas/APIInfo"
        health:
          $ref: "#/components/schemas/Health"
          description: |
            The full health document, as `GET /health` returns it with a
            session, including degraded components.
    APIInfo:
      type: object
      description: The skep-api process that answered the request.
      required: [tls]
      properties:
        tls:
          type: object
          description: |
            The certificate skep-api serves. Nothing here is secret: a
            client sees the same in the TLS handshake.
          required: [source, not_after, public_key_sha256]
          properties:
            source:
              type: string
              enum: [self-signed, operator]
              description: |
                `self-signed` certificates are generated and renewed by
                skep-api, always with the same key. `operator`
                certificates come from the configuration and are never
                renewed by Skep.
            not_after:
              type: string
              format: date-time
              description: When the certificate expires.
            public_key_sha256:
              type: string
              description: |
                SHA-256 of the certificate's SubjectPublicKeyInfo, as
                `sha256:<hex>`. This is the value clients pin. It does
                not change when the certificate is renewed.
              example: "sha256:5a43bd278be4dd4c6857b0c10c00172bf7f2bd89ce155f249179bdb59086c5c1"
    Hardware:
      type: object
      required:
        - node_id
        - platform
        - host
        - cpu
        - memory
        - hypervisors
        - storage
        - warnings
        - collected_at
      properties:
        node_id: { type: string }
        platform:
          $ref: "#/components/schemas/Platform"
        host:
          type: object
          required: [hostname, os, architecture]
          properties:
            hostname: { type: string }
            os:
              $ref: "#/components/schemas/OSInfo"
            architecture: { type: string }
        cpu:
          type: object
          required: [model, cores, threads]
          properties:
            model: { type: string }
            cores:
              type: integer
              description: Physical cores.
            threads:
              type: integer
              description: Logical CPUs.
        memory:
          type: object
          required: [total_bytes, available_bytes]
          properties:
            total_bytes:
              type: integer
              format: int64
            available_bytes:
              type: integer
              format: int64
              description: |
                On FreeBSD, the free, inactive, and laundry page queues. On
                Linux, MemAvailable.
        hypervisors:
          type: object
          required: [bhyve, qemu]
          properties:
            bhyve:
              $ref: "#/components/schemas/Bhyve"
            qemu:
              $ref: "#/components/schemas/QEMU"
        storage:
          type: object
          required: [zfs]
          properties:
            zfs:
              $ref: "#/components/schemas/ZFS"
        warnings:
          type: array
          description: Facts that could not be discovered.
          items: { type: string }
        collected_at:
          type: string
          format: date-time
    Bhyve:
      allOf:
        - $ref: "#/components/schemas/Capability"
        - type: object
          required: [vmm_loaded, vmm_loadable]
          properties:
            vmm_loaded:
              type: boolean
              description: The vmm kernel module is loaded.
            vmm_loadable:
              type: boolean
              description: vmm.ko is present. Discovery never loads it.
            vmm_device:
              type: string
              description: The vmm device node that was found, if any.
            binary_path:
              type: string
    QEMU:
      allOf:
        - $ref: "#/components/schemas/Capability"
        - type: object
          required: [binaries]
          properties:
            acceleration:
              type: string
              enum: [tcg]
              description: |
                Present when QEMU is available. Always `tcg`: there is no KVM
                on FreeBSD.
            binaries:
              type: array
              items:
                type: object
                required: [name, path]
                properties:
                  name: { type: string }
                  path: { type: string }
                  version: { type: string }
                  error:
                    type: string
                    description: Why the version could not be read.
    ZFS:
      allOf:
        - $ref: "#/components/schemas/Capability"
        - type: object
          required: [module_loaded, pools]
          properties:
            module_loaded: { type: boolean }
            module_version: { type: string }
            zpool_path: { type: string }
            pools:
              type: array
              description: |
                Imported pools. Only queried when the kernel module is
                already loaded.
              items:
                $ref: "#/components/schemas/ZFSPool"
            pools_error:
              type: string
              description: Why the pool list could not be read.
    ZFSPool:
      type: object
      required:
        - name
        - size_bytes
        - allocated_bytes
        - free_bytes
        - fragmentation_percent
        - capacity_percent
        - health
      properties:
        name: { type: string }
        size_bytes:
          type: integer
          format: int64
        allocated_bytes:
          type: integer
          format: int64
        free_bytes:
          type: integer
          format: int64
        fragmentation_percent:
          type: integer
          nullable: true
        capacity_percent:
          type: integer
          nullable: true
        health:
          type: string
          example: ONLINE
