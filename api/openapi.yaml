        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      tags: [containers]
      operationId: deleteContainerSnapshot
      summary: Delete a jail snapshot
      x-skep-permission: container:snapshot
      description: |
        Requires `container:snapshot`. Submits
        `container.snapshot.delete`, which destroys the snapshot. The jail
