openapi: 3.0.3
info:
  title: Skep API
  version: 0.1.0
  description: |
    REST API of Skep, a virtualization and infrastructure management platform
    built on the FreeBSD® operating system.

    The API is served by `skep-api`, an unprivileged process that reads
    everything about the node from `skep-agent` over a local Unix socket.

    **Authentication.** Every endpoint except `GET /health` and
    `POST /auth/login` needs a session. A login produces one kind of
    session, chosen by the client:

    - a **cookie session** (the default, for browsers): the token is set
      in the cookie `__Host-skep_session` (`Secure`, `HttpOnly`,
      `SameSite=Strict`) and is not in the response body;
    - a **bearer session** (`"session": "bearer"`, for `skepctl` and
      scripts): the token is returned in the response body, no cookie is
      set, and the client sends it as `Authorization: Bearer <token>`.

    A token is accepted only through the channel it was issued for.
    Sessions end after 30 minutes without use and 12 hours after the login
    (both configurable), at logout, and when the user's password or role
    changes or the user is disabled.

    A request that is authenticated by cookie and is not a GET or HEAD
    must carry an `Origin` header that matches the request host, or it is
    refused with `403 forbidden`. Bearer requests are exempt.

    There are no default credentials. The first administrator is created
    on the host with `skep-api admin create`; until one exists, login
    answers `503 setup_required`. Logins are rate limited (`429
    rate_limited` with `Retry-After`); accounts are never locked.

    **Authorization.** Every user has one role, and a role is a set of
    permission strings. Each endpoint requires one permission (listed in
    its description); anything not granted is denied with
    `403 forbidden`, and every denial is audited. Built-in roles:
    `admin` (everything), `operator` (all reads plus operational actions;
    never user management), `viewer` (reads, without users and the audit
    log). The endpoints under `/auth` need only a session.

    `skep-api` listens on loopback unless `listen_address` is changed.

    The API is served over TLS 1.3 only. There is no plaintext listener.
    Unless an operator-supplied certificate is configured, `skep-api`
    generates a self-signed certificate at first start; its public key
    pin is printed by `skep-api tls fingerprint` on the host and reported
    in the system document.

    When the agent cannot be reached, node endpoints answer
    `503 agent_unavailable`.

    Every error response uses the `ErrorResponse` envelope. Every response
    carries an `X-Request-ID` header; a well-formed ID sent by the client is
    echoed back.
servers:
  - url: https://127.0.0.1:8443/api/v1
    description: Local skep-api (default listen address)
security:
  - bearer: []
  - cookie: []
tags:
  - name: auth
    description: Login, logout, and the caller's own session and password
  - name: users
    description: Accounts, roles, and the access audit log
  - name: system
    description: Health and identity of the local node
  - name: nodes
    description: Node inventory
  - name: tasks
    description: |
      Asynchronous operations performed by the agent. Tasks can be read
      and cancelled. They cannot be submitted over the API yet.
paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Health
      security: [{}, {bearer: []}, {cookie: []}]
      description: |
        Reports whether the service can serve requests, and whether any
        component needs attention.

        The status is `ok`, `degraded` or `unavailable`. `unavailable`
        means a critical check failed and the service cannot serve
        requests: the agent cannot be reached (`agent`), or the agent's
        database cannot (`database`). It is the only status answered with
        `503`. `degraded` means a non-critical check failed; the service
        still serves requests and the answer is `200`. Monitoring that must
        notice a degraded component checks the `status` field, not only the
        HTTP status. A load balancer or supervisor can use the HTTP status
        alone.

        Without a session the response is the status and nothing else
        (`HealthStatus`). With a session it is the full `Health` document,
        where each check says whether it is critical. The same document is
        in the system document's `health` field.

        Two checks concern the audit archives: `audit_archive` (the
        agent's operation audit log) and `access_audit_archive`
        (skep-api's access audit log). Each is `degraded` when the
        archive failed verification or a needed segment is missing, and
        when the previous month is still unsealed 7 days into the new
        one. Neither is critical. A check is absent when archiving is
        turned off.
      responses:
        "200":
          description: The service serves requests. The status is `ok` or `degraded`.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/HealthStatus"
                  - $ref: "#/components/schemas/Health"
        "503":
          description: |
            A critical check failed and the service cannot serve requests.
            The status is `unavailable`. The body has the same shape as for 200.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/HealthStatus"
                  - $ref: "#/components/schemas/Health"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Start a session
      security: []
      description: |
        Checks a username and password and starts a new session. The body
        must be `application/json`. If the request has an `Origin` header
        it must match the request host.

        Every failed login answers the same `401 invalid_credentials`,
        whether the username exists or not, and takes the same time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: |
            Logged in. For a cookie session the token is in `Set-Cookie`
            and not in the body. For a bearer session it is in `token` and
            no cookie is set.
          headers:
            Set-Cookie:
              description: The session cookie. Only for a cookie session.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          description: The username or password is not correct (`invalid_credentials`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          description: The body is not `application/json` (`invalid_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: |
            No administrator exists yet (`setup_required`). Create one on
            the host with `skep-api admin create --username NAME`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the current session
      description: Deletes the session the request came in on and clears the cookie of a cookie session.
      responses:
        "204":
          description: Logged out.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: The caller and the session in use
      responses:
        "200":
          description: The user, the session, and the permissions of the user's role. Never the token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /auth/password:
    put:
      tags: [auth]
      operationId: changePassword
      summary: Change the caller's own password
      description: |
        Needs the current password. On success every session of the user
        ends, including the one that made the request; log in again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: The password was changed and all of the user's sessions were ended.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          description: |
            No valid session (`unauthenticated`), or the current password
            is not correct (`invalid_credentials`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /system:
    get:
      tags: [system]
      operationId: getSystem
      summary: Local node description
      x-skep-permission: system:read
      description: |
        Identity of the local node, its operating system, the Skep build, and
        a capability summary. The `node_id` is generated on first start and
        never changes afterwards.
      responses:
        "200":
          description: The system document.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/System"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /nodes/{id}/hardware:
    get:
      tags: [nodes]
      operationId: getNodeHardware
      summary: Hardware and capabilities of a node
      x-skep-permission: node:read
      description: |
        Result of read-only host discovery. Only the local node exists in
        0.1.0; use the `node_id` from `/system`. Results are cached briefly
        (`discovery.cache_ttl`, 10 seconds by default).

        A probe that fails does not fail the request: the capability is
        reported as `unknown` or `unavailable` with a reason, and missing
        facts are listed in `warnings`.
      parameters:
        - name: id
          in: path
          required: true
          description: Stable node ID.
          schema:
            type: string
            pattern: "^[A-Za-z0-9._-]{1,64}$"
      responses:
        "200":
          description: The hardware document.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hardware"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      summary: List tasks
      x-skep-permission: task:read
      description: |
        Returns tasks newest first. Entries are summaries: `result` is only
        returned by the single-task endpoint.

        Collections are paginated with a cursor. Pass the `next_cursor` of
        one page as `cursor` to get the next; it is absent on the last page.
      parameters:
        - name: status
          in: query
          description: Only return tasks in this status.
          schema:
            $ref: "#/components/schemas/TaskStatus"
        - name: limit
          in: query
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          description: The `next_cursor` of the previous page.
          schema:
            type: string
      responses:
        "200":
          description: One page of tasks.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /tasks/{id}:
    get:
      tags: [tasks]
      operationId: getTask
      summary: One task with its event history
      description: |
        A finished task is deleted, with its events, once it is older than
        the agent's task retention (90 days by default); the newest
        finished task of each resource is kept. After that this endpoint
        answers `404`, and what the task did remains in the agent's audit
        log.
      x-skep-permission: task:read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9._-]{1,64}$"
      responses:
        "200":
          description: The task and its events, oldest first.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /tasks/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [tasks]
      operationId: cancelTask
      summary: Cancel a task
      x-skep-permission: task:cancel
      description: |
        Requires `task:cancel`. Asks the agent to cancel a task and returns
        the task as it is after the request. The request has no body.

        A pending task becomes `cancelled` at once. A running task has the
        request recorded (`cancel_requested_at`) and becomes `cancelled`
        when it stops; read the task again to see the outcome. A finished
        task is returned unchanged. Cancellation is cooperative and rolls
        nothing back.

        The agent records the caller as the actor of the cancellation in
        its operation audit log; the request ID links that entry to the
        access audit log.
      responses:
        "200":
          description: The task after the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A running task of this type cannot be cancelled (`not_cancellable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/Unavailable"
  /users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List users
      description: Requires `user:read`.
      responses:
        "200":
          description: Every user, ordered by username.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [users]
      operationId: createUser
      summary: Create a user
      description: Requires `user:manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewUser"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The username is taken (`username_taken`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [users]
      operationId: getUser
      summary: Get a user
      description: Requires `user:read`.
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [users]
      operationId: updateUser
      summary: Change a user
      description: |
        Requires `user:manage`. Fields that are left out are not changed.
        A change of role, disabling, and a new password end all of the
        user's sessions. The only enabled administrator cannot be disabled
        or given another role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: The user after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LastAdmin"
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Delete a user
      description: |
        Requires `user:manage`. Ends the user's sessions. The only enabled
        administrator cannot be deleted. Audit entries about the user are
        kept.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LastAdmin"
  /roles:
    get:
      tags: [users]
      operationId: listRoles
      summary: List roles
      description: Requires `role:read`. Roles cannot be edited through the API in this release.
      responses:
        "200":
          description: Every role with its permissions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /audit:
    get:
      tags: [users]
      operationId: listAudit
      summary: Read the access audit log
      description: |
        Requires `audit:read`. Returns authentication events, authorization
        denials, and administrative changes, newest first. An entry is
        never changed. Entries are served from the live table: by default
        they are removed from it 90 days after the end of their month,
        once they are in a sealed archive segment, and are then read on
        the host with `skep-api audit export`. The log never contains
        passwords, session tokens, or their hashes. Operations performed
        on the host are recorded separately by the agent.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: cursor
          in: query
          description: The `next_cursor` of the previous page.
          schema:
            type: string
      responses:
        "200":
          description: One page of entries.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEntry"
                  next_cursor:
                    type: string
                    description: Empty or absent on the last page.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: The token of a bearer session, from a login that asked for one.
    cookie:
      type: apiKey
      in: cookie
      name: __Host-skep_session
      description: The cookie of a cookie session. Set by the login; never readable by JavaScript.
  headers:
    RequestID:
      description: ID that correlates the response with the server logs.
      schema:
        type: string
  responses:
    InvalidRequest:
      description: The request is malformed (`invalid_request`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The resource or endpoint does not exist (`not_found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: not_found
              message: the requested resource does not exist
              request_id: bffe76d4cd48e82bd841254b
    Unauthenticated:
      description: The request carries no valid session (`unauthenticated`).
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer realm="skep"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    LastAdmin:
      description: The user is the only enabled administrator (`last_admin`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: |
        The request is not allowed (`forbidden`): the `Origin` header is
        missing or does not match the host on a cookie-authenticated
        request that changes something, or the caller's role lacks the
        permission the endpoint requires (named in `details.permission`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Too many login attempts (`rate_limited`). Nothing is locked; wait and try again.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    MethodNotAllowed:
      description: The method is not supported on this endpoint (`method_not_allowed`).
      headers:
        Allow:
          schema:
            type: string
            example: GET, HEAD
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Unexpected server error (`internal_error`). Details are in the server log only.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unavailable:
      description: |
        The host agent cannot be reached (`agent_unavailable`), or the
        request was cancelled or timed out (`service_unavailable`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                Stable, machine-readable error code. `resource_busy`,
                `idempotency_key_conflict`, and `queue_full` are returned
                by task submission, which is not exposed yet.
              enum:
                - invalid_request
                - not_found
                - method_not_allowed
                - internal_error
                - service_unavailable
                - agent_unavailable
                - unauthenticated
                - invalid_credentials
                - forbidden
                - rate_limited
                - setup_required
                - username_taken
                - last_admin
                - unknown_role
                - resource_busy
                - idempotency_key_conflict
                - not_cancellable
                - queue_full
                - shutting_down
            message:
              type: string
              description: Human-readable description.
            request_id:
              type: string
            details:
              type: object
              additionalProperties: true
              description: Optional structured context.
    TaskStatus:
      type: string
      enum: [pending, running, succeeded, failed, cancelled, interrupted]
      description: |
        `succeeded`, `failed`, `cancelled`, and `interrupted` are terminal:
        a task in one of them never changes again. `interrupted` means the
        agent stopped or restarted before the task finished. Interrupted
        tasks are never resumed.
    Task:
      type: object
      required: [id, node_id, type, status, actor, cancellable, created_at]
      properties:
        id: { type: string }
        node_id: { type: string }
        type:
          type: string
          example: discovery.refresh
        status:
          $ref: "#/components/schemas/TaskStatus"
        resource_type:
          type: string
          description: The kind of resource the task operates on.
        resource_id: { type: string }
        actor:
          type: object
          required: [id, name]
          description: |
            Who the task was requested for. Tasks the agent starts itself
            have the actor `system`.
          properties:
            id: { type: string }
            name: { type: string }
        request_id: { type: string }
        cancellable:
          type: boolean
          description: Whether this task can be cancelled while it is running.
        cancel_requested_at:
          type: string
          format: date-time
        result:
          description: |
            Result of a succeeded task. Only returned by the single-task
            endpoint.
        error:
          type: object
          required: [code, message]
          description: Present when the task did not succeed.
          properties:
            code:
              type: string
              example: timeout
            message: { type: string }
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
    TaskEvent:
      type: object
      required: [id, kind, level, message, created_at]
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum: [state, progress]
          description: |
            `state` events record state changes. `progress` events are
            messages from the task while it runs.
        level:
          type: string
          enum: [debug, info, warn, error]
        message: { type: string }
        data:
          description: Optional structured context.
        created_at:
          type: string
          format: date-time
    TaskDetail:
      allOf:
        - $ref: "#/components/schemas/Task"
        - type: object
          required: [events]
          properties:
            events:
              type: array
              items:
                $ref: "#/components/schemas/TaskEvent"
    TaskList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        next_cursor:
          type: string
          description: Pass as `cursor` to get the next page. Absent on the last page.
    Capability:
      type: object
      required: [status, reason]
      properties:
        status:
          type: string
          enum: [available, unavailable, unknown]
          description: |
            `available` was verified usable, `unavailable` was verified not
            usable, `unknown` could not be determined.
        reason:
          type: string
          description: Why the capability has this status.
    HealthStatus:
      type: object
      description: What the health endpoint returns without a session.
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable]
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        session:
          type: string
          enum: [cookie, bearer]
          default: cookie
          description: |
            The kind of session to start. `cookie` sets the session cookie
            and returns no token. `bearer` returns the token in the body
            and sets no cookie.
    PasswordChange:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 12
          maxLength: 256
          description: 12 to 256 characters. There are no composition rules.
    User:
      type: object
      description: An account. The password hash is never part of it.
      required: [id, username, display_name, role, disabled, created_at, updated_at]
      properties:
        id: { type: string }
        username: { type: string }
        display_name: { type: string }
        role:
          type: string
          description: Name of the user's role.
          example: admin
        disabled: { type: boolean }
        last_login_at:
          type: string
          format: date-time
        password_changed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    NewUser:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          pattern: "^[a-z][a-z0-9._-]{0,31}$"
        display_name:
          type: string
          maxLength: 128
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 256
        role:
          type: string
          default: viewer
          description: Name of a role.
    UserUpdate:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 128
        role:
          type: string
        disabled:
          type: boolean
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 256
          description: Sets a new password and ends the user's sessions.
    Role:
      type: object
      required: [id, name, description, permissions, built_in]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        permissions:
          type: array
          description: Permission strings of the form resource:action. An asterisk means every permission.
          items:
            type: string
        built_in:
          type: boolean
          description: Built-in roles cannot be changed or deleted.
    AuditEntry:
      type: object
      required: [id, occurred_at, actor_name, action, outcome]
      properties:
        id:
          type: integer
          format: int64
        occurred_at:
          type: string
          format: date-time
        actor_id:
          type: string
          description: Absent when no known user was involved.
        actor_name:
          type: string
          description: A username, `system`, or `local:<uid>` for a command run on the host.
        action:
          type: string
          example: auth.login
        resource_type: { type: string }
        resource_id: { type: string }
        outcome:
          type: string
          enum: [success, failure, denied]
        source_ip: { type: string }
        request_id: { type: string }
        details:
          type: object
          additionalProperties: true
    SessionResponse:
      type: object
      required: [user, session, permissions]
      properties:
        user:
          $ref: "#/components/schemas/User"
        session:
          type: object
          required: [kind, created_at, expires_at, idle_timeout_seconds]
          properties:
            kind:
              type: string
              enum: [cookie, bearer]
            created_at:
              type: string
              format: date-time
            expires_at:
              type: string
              format: date-time
              description: The absolute end of the session.
            idle_timeout_seconds:
              type: integer
              format: int64
              description: How long the session survives without use.
        permissions:
          type: array
          description: The permission strings of the user's role. An asterisk means every permission.
          items:
            type: string
        token:
          type: string
          description: |
            The session token. Present only in the response to a login
            that asked for a bearer session. It is shown once and is not
            stored by the server, which keeps only its SHA-256.
    Health:
      type: object
      required: [status, version, uptime_seconds, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable]
          description: The worst status of the checks.
        version:
          type: string
        uptime_seconds:
          type: integer
          format: int64
        checks:
          type: object
          additionalProperties:
            type: object
            required: [status, critical]
            properties:
              status:
                type: string
                enum: [ok, degraded, unavailable]
                description: |
                  `ok`, or when the check failed, `unavailable` for a
                  critical check and `degraded` for any other.
              critical:
                type: boolean
                description: The service cannot serve requests while this check fails.
              error:
                type: string
    BuildInfo:
      type: object
      required: [version, commit, build_date, go_version, os, arch]
      properties:
        version: { type: string }
        commit: { type: string }
        build_date: { type: string }
        go_version: { type: string }
        os: { type: string }
        arch: { type: string }
    OSInfo:
      type: object
      required: [name, version, release, kernel]
      properties:
        name:
          type: string
          example: FreeBSD
        version:
          type: string
          example: "15.1"
        release:
          type: string
          example: 15.1-RELEASE-p6
        kernel:
          type: string
    Platform:
      type: string
      enum: [freebsd, linux-dev, unsupported]
      description: |
        `freebsd` is the only production platform. `linux-dev` is a
        development host and never a production host.
    System:
      type: object
      required:
        - node_id
        - hostname
        - platform
        - production_host
        - dev_mode
        - os
        - architecture
        - skep
        - capabilities
        - started_at
        - uptime_seconds
      properties:
        node_id:
          type: string
          description: Stable ID of the local node.
        hostname: { type: string }
        platform:
          $ref: "#/components/schemas/Platform"
        production_host:
          type: boolean
          description: True only on native FreeBSD outside dev mode.
        dev_mode: { type: boolean }
        os:
          $ref: "#/components/schemas/OSInfo"
        architecture: { type: string }
        skep:
          $ref: "#/components/schemas/BuildInfo"
        capabilities:
          type: object
          required: [bhyve, qemu, zfs]
          properties:
            bhyve:
              $ref: "#/components/schemas/Capability"
            qemu:
              $ref: "#/components/schemas/Capability"
            zfs:
              $ref: "#/components/schemas/Capability"
        started_at:
          type: string
          format: date-time
        uptime_seconds:
          type: integer
          format: int64
        api:
          $ref: "#/components/schemas/APIInfo"
        health:
          $ref: "#/components/schemas/Health"
          description: |
            The full health document, as `GET /health` returns it with a
            session, including degraded components.
    APIInfo:
      type: object
      description: The skep-api process that answered the request.
      required: [tls]
      properties:
        tls:
          type: object
          description: |
            The certificate skep-api serves. Nothing here is secret: a
            client sees the same in the TLS handshake.
          required: [source, not_after, public_key_sha256]
          properties:
            source:
              type: string
              enum: [self-signed, operator]
              description: |
                `self-signed` certificates are generated and renewed by
                skep-api, always with the same key. `operator`
                certificates come from the configuration and are never
                renewed by Skep.
            not_after:
              type: string
              format: date-time
              description: When the certificate expires.
            public_key_sha256:
              type: string
              description: |
                SHA-256 of the certificate's SubjectPublicKeyInfo, as
                `sha256:<hex>`. This is the value clients pin. It does
                not change when the certificate is renewed.
              example: "sha256:5a43bd278be4dd4c6857b0c10c00172bf7f2bd89ce155f249179bdb59086c5c1"
    Hardware:
      type: object
      required:
        - node_id
        - platform
        - host
        - cpu
        - memory
        - hypervisors
        - storage
        - warnings
        - collected_at
      properties:
        node_id: { type: string }
        platform:
          $ref: "#/components/schemas/Platform"
        host:
          type: object
          required: [hostname, os, architecture]
          properties:
            hostname: { type: string }
            os:
              $ref: "#/components/schemas/OSInfo"
            architecture: { type: string }
        cpu:
          type: object
          required: [model, cores, threads]
          properties:
            model: { type: string }
            cores:
              type: integer
              description: Physical cores.
            threads:
              type: integer
              description: Logical CPUs.
        memory:
          type: object
          required: [total_bytes, available_bytes]
          properties:
            total_bytes:
              type: integer
              format: int64
            available_bytes:
              type: integer
              format: int64
              description: |
                On FreeBSD, the free, inactive, and laundry page queues. On
                Linux, MemAvailable.
        hypervisors:
          type: object
          required: [bhyve, qemu]
          properties:
            bhyve:
              $ref: "#/components/schemas/Bhyve"
            qemu:
              $ref: "#/components/schemas/QEMU"
        storage:
          type: object
          required: [zfs]
          properties:
            zfs:
              $ref: "#/components/schemas/ZFS"
        warnings:
          type: array
          description: Facts that could not be discovered.
          items: { type: string }
        collected_at:
          type: string
          format: date-time
    Bhyve:
      allOf:
        - $ref: "#/components/schemas/Capability"
        - type: object
          required: [vmm_loaded, vmm_loadable]
          properties:
            vmm_loaded:
              type: boolean
              description: The vmm kernel module is loaded.
            vmm_loadable:
              type: boolean
              description: vmm.ko is present. Discovery never loads it.
            vmm_device:
              type: string
              description: The vmm device node that was found, if any.
            binary_path:
              type: string
    QEMU:
      allOf:
        - $ref: "#/components/schemas/Capability"
        - type: object
          required: [binaries]
          properties:
            acceleration:
              type: string
              enum: [tcg]
              description: |
                Present when QEMU is available. Always `tcg`: there is no KVM
                on FreeBSD.
            binaries:
              type: array
              items:
                type: object
                required: [name, path]
                properties:
                  name: { type: string }
                  path: { type: string }
                  version: { type: string }
                  error:
                    type: string
                    description: Why the version could not be read.
    ZFS:
      allOf:
        - $ref: "#/components/schemas/Capability"
        - type: object
          required: [module_loaded, pools]
          properties:
            module_loaded: { type: boolean }
            module_version: { type: string }
            zpool_path: { type: string }
            pools:
              type: array
              description: |
                Imported pools. Only queried when the kernel module is
                already loaded.
              items:
                $ref: "#/components/schemas/ZFSPool"
            pools_error:
              type: string
              description: Why the pool list could not be read.
    ZFSPool:
      type: object
      required:
        - name
        - size_bytes
        - allocated_bytes
        - free_bytes
        - fragmentation_percent
        - capacity_percent
        - health
      properties:
        name: { type: string }
        size_bytes:
          type: integer
          format: int64
        allocated_bytes:
          type: integer
          format: int64
        free_bytes:
          type: integer
          format: int64
        fragmentation_percent:
          type: integer
          nullable: true
        capacity_percent:
          type: integer
          nullable: true
        health:
          type: string
          example: ONLINE
