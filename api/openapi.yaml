openapi: 3.0.3
info:
  title: Skep API
  version: 0.1.0
  license:
    name: BSD-2-Clause
    url: https://opensource.org/license/bsd-2-clause
  description: |
    REST API of Skep, a virtualization and infrastructure management platform
    built on the FreeBSD® operating system.

    The API is served by `skep-api`, an unprivileged process that reads
    everything about the node from `skep-agent` over a local Unix socket.

    **Authentication.** Every endpoint except `GET /health` and
    `POST /auth/login` needs a session. A login produces one kind of
    session, chosen by the client:

    - a **cookie session** (the default, for browsers): the token is set
      in the cookie `__Host-skep_session` (`Secure`, `HttpOnly`,
      `SameSite=Strict`) and is not in the response body;
    - a **bearer session** (`"session": "bearer"`, for `skepctl` and
      scripts): the token is returned in the response body, no cookie is
      set, and the client sends it as `Authorization: Bearer <token>`.

    A token is accepted only through the channel it was issued for.
    Sessions end after 30 minutes without use and 12 hours after the login
    (both configurable), at logout, and when the user's password or role
    changes or the user is disabled.

    Any request that carries an `Origin` header, on any endpoint and with
    any credentials or none, must name the request host over HTTPS
    (`https://` plus `Host`), or it is refused with `403 forbidden`.
    Requests without `Origin`, as `skepctl` and `curl` send them, are not
    affected, except that a request authenticated by cookie that is not a
    GET or HEAD must carry a matching `Origin`.

    **Background requests.** A request the client makes by itself, such
    as a timer-driven refresh, may carry the header `X-Skep-Background`
    (any non-empty value). It is authenticated like any other request,
    the idle timeout included, but it does not count as use of the
    session: it does not extend the idle timeout, so an unattended page
    idles out. A client can only shorten its own session with it, never
    lengthen it. Requests the user caused should not carry it.

    There are no default credentials. The first administrator is created
    on the host with `skep-api admin create`; until one exists, login
    answers `503 setup_required`. Logins are rate limited (`429
    rate_limited` with `Retry-After`); accounts are never locked.

    **Users are the cluster's** (ADR 0013 amendment 4). Every node keeps a
    read copy of the users that `skep-cluster` replicates, and every user
    change goes through `skep-cluster`. Without quorum (`skep-cluster`
    unreachable, no leader, or no answer for 15 s) a user change answers
    `503 no_quorum` with `details.outcome` `not_written`, `unknown` or
    `written_not_synced`; only an enabled administrator may log in, and
    gets a **degraded** session (`session.degraded`) that ends at most one
    hour after the login; any other user with the right password gets
    `503 no_quorum`. On a host upgraded from 0.1 whose users have not been
    imported (`skep-api admin import-users`), a user change answers
    `503 users_import_pending`.

    **The limit on a node without quorum** (step 8d-1, ADR 0013 amendment
    6). While this node has no quorum, and for a degraded session (also
    after quorum is back), only these are served: every `GET` except
    `/vms/{id}/console/serial`, `POST /auth/login`, `POST /auth/logout`,
    `POST /vms/{id}/actions`, `POST /containers/{id}/actions` and
    `POST /tasks/{id}/cancel`. Every other request answers `503 no_quorum`
    before anything is done, with `details.outcome` `not_written` and
    `details.reason` `no_quorum` or `degraded_session`, and is audited
    (`request.no_quorum`). While there is no quorum every answer to an
    authenticated request carries the header `Skep-Quorum: none`.

    **The guest inventory** (step 8d-1). VM and jail names are unique in
    the cluster per kind: a create or a clone first reserves its name in
    the replicated inventory (`409 vm_name_taken` or
    `409 container_name_taken` naming the node that holds it,
    `409 too_many_guests` at 10000 guests and reservations, `503
    no_quorum` when the reservation cannot be committed; in each case the
    host is not asked). `GET /cluster/guests` lists the inventory. While
    the host's agent is draining (an upgrade or a join), a new task
    answers `503 node_draining` with the reason and the expiry.

    **Authorization.** Every user has one role, and a role is a set of
    permission strings. Each endpoint requires one permission (listed in
    its description); anything not granted is denied with
    `403 forbidden`, and every denial is audited. Built-in roles:
    `admin` (everything), `operator` (all reads plus operational actions;
    never user management), `viewer` (reads, without users and the audit
    log). The endpoints under `/auth` need only a session.

    `skep-api` listens on loopback unless `listen_address` is changed.

    The API is served over TLS 1.3 only. There is no plaintext listener.
    Unless an operator-supplied certificate is configured, `skep-api`
    generates a self-signed certificate at first start; its public key
    pin is printed by `skep-api tls fingerprint` on the host and reported
    in the system document.

    When the agent cannot be reached, node endpoints answer
    `503 agent_unavailable`. When the agent is another build than
    `skep-api` (only one of them was restarted after an upgrade), they
    answer `503 agent_version_mismatch`; restarting both
    (`skep-setup upgrade`) clears it.

    Every error response uses the `ErrorResponse` envelope. Every response
    carries an `X-Request-ID` header; a well-formed ID sent by the client is
    echoed back.
servers:
  - url: https://127.0.0.1:8443/api/v1
    description: Local skep-api (default listen address)
security:
  - bearer: []
  - cookie: []
tags:
  - name: auth
    description: Login, logout, and the caller's own session and password
  - name: users
    description: Accounts, roles, and the access audit log
  - name: cluster
    description: This node's cluster, admissions and removals (ADR 0013)
  - name: system
    description: Health and identity of the local node
  - name: nodes
    description: Node inventory
  - name: tasks
    description: |
      Asynchronous operations performed by the agent. Tasks can be read
      and cancelled. They are submitted by the VM endpoints, never directly.
  - name: vms
    description: Virtual machines (bhyve)
  - name: containers
    description: FreeBSD jails on clones of a template
  - name: storage
    description: Storage pools and install media VMs may use
paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Health
      security: [{}, {bearer: []}, {cookie: []}]
      parameters:
        - $ref: "#/components/parameters/Background"
      description: |
        Reports whether the service can serve requests, and whether any
        component needs attention.

        The status is `ok`, `degraded` or `unavailable`. `unavailable`
        means a critical check failed and the service cannot serve
        requests: the agent cannot be reached (`agent`), or the agent's
        database cannot (`database`). It is the only status answered with
        `503`. `degraded` means a non-critical check failed; the service
        still serves requests and the answer is `200`. Monitoring that must
        notice a degraded component checks the `status` field, not only the
        HTTP status. A load balancer or supervisor can use the HTTP status
        alone.

        Without a session the response is the status and nothing else
        (`HealthStatus`). With a session it is the full `Health` document,
        where each check says whether it is critical. The same document is
        in the system document's `health` field.

        When the agent's socket does not answer, the `agent` check's
        `error` is a fixed text: the agent is down, still starting, or
        refusing to start; see `/var/log/daemon.log`, where a refused start
        is logged. It never
        carries the agent's own error text or the paths it refused on, and
        a caller without a session still gets the status alone.

        This is the only health endpoint. `/health` and `/healthz` at the
        root of the HTTPS port, outside `/api/v1`, with or without a
        trailing slash, answer `404` with the
        standard error body naming this path, so that a check pointed at
        them cannot pass on the web interface's `200`.

        Two checks concern the audit archives: `audit_archive` (the
        agent's operation audit log) and `access_audit_archive`
        (skep-api's access audit log). Each is `degraded` when the
        archive failed verification or a needed segment is missing, and
        when the previous month is still unsealed 7 days into the new
        one. Neither is critical. A check is absent when archiving is
        turned off.

        `nested_interrupts` appears only on a host that runs under another
        hypervisor with `hw.vmm.vmx.cap.virtual_interrupt_delivery` not 0,
        where the first VM start can freeze the whole host. It is
        `degraded`, is not critical, and names the `loader.conf` line.
        The condition is evaluated once, at agent start: if `vmm` is loaded
        after the agent started, there is no warning and no check until the
        agent restarts.

        Two concern storage (ADR 0010 decision 15), both from the agent's
        resource sample (`GET /metrics`, at most a minute old):
        `storage_capacity` is `degraded` when an allow-listed pool or
        directory pool is past `storage.capacity_warn_percent` (default
        80) or `storage.capacity_fail_percent` (default 90) of its space
        in use, or cannot be read; its `error` says which pool, how full,
        and which threshold it passed. `storage_locked` is `degraded` when
        a dataset under a pool's dataset root has its encryption key
        unloaded, naming the datasets. Neither is critical: a full or
        locked pool stops what needs it, not the service. The health
        document has no separate "warning" status, so a pool past either
        threshold reads `degraded`; `GET /metrics` tells `warning` from
        `failing`.
      responses:
        "200":
          description: The service serves requests. The status is `ok` or `degraded`.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/HealthStatus"
                  - $ref: "#/components/schemas/Health"
        "503":
          description: |
            A critical check failed and the service cannot serve requests.
            The status is `unavailable`. The body has the same shape as for 200.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/HealthStatus"
                  - $ref: "#/components/schemas/Health"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Start a session
      security: []
      description: |
        Checks a username and password and starts a new session. The body
        must be `application/json`. If the request has an `Origin` header
        it must name the request host over HTTPS, as for every endpoint.

        Every failed login answers the same `401 invalid_credentials`,
        whether the username exists or not, and takes the same time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: |
            Logged in. For a cookie session the token is in `Set-Cookie`
            and not in the body. For a bearer session it is in `token` and
            no cookie is set.
          headers:
            Set-Cookie:
              description: The session cookie. Only for a cookie session.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          description: The username or password is not correct (`invalid_credentials`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          description: The body is not `application/json` (`invalid_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: |
            No administrator exists yet (`setup_required`). Create one on
            the host with `skep-api admin create --username NAME`. Or
            `skep-cluster` has no quorum (`no_quorum`): only an enabled
            administrator may log in then, with a degraded session, and
            an empty copy of the users answers `no_quorum` for everyone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the current session
      description: Deletes the session the request came in on and clears the cookie of a cookie session.
      responses:
        "204":
          description: Logged out.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: The caller and the session in use
      parameters:
        - $ref: "#/components/parameters/Background"
      responses:
        "200":
          description: The user, the session, and the permissions of the user's role. Never the token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /auth/password:
    put:
      tags: [auth]
      operationId: changePassword
      summary: Change the caller's own password
      description: |
        Needs the current password. On success every session of the user
        ends, including the one that made the request; log in again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: The password was changed and all of the user's sessions were ended.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          description: |
            No valid session (`unauthenticated`), or the current password
            is not correct (`invalid_credentials`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /system:
    get:
      tags: [system]
      operationId: getSystem
      summary: Local node description
      x-skep-permission: system:read
      parameters:
        - $ref: "#/components/parameters/Background"
      description: |
        Identity of the local node, its operating system, the Skep build, and
        a capability summary. The `node_id` is generated on first start and
        never changes afterwards.
      responses:
        "200":
          description: The system document.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/System"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /nodes/{id}/hardware:
    get:
      tags: [nodes]
      operationId: getNodeHardware
      summary: Hardware and capabilities of a node
      x-skep-permission: node:read
      description: |
        Result of read-only host discovery. Only the local node exists in
        0.1.0; use the `node_id` from `/system`. Results are cached briefly
        (`discovery.cache_ttl`, 10 seconds by default).

        A probe that fails does not fail the request: the capability is
        reported as `unknown` or `unavailable` with a reason, and missing
        facts are listed in `warnings`.
      parameters:
        - $ref: "#/components/parameters/Background"
        - name: id
          in: path
          required: true
          description: Stable node ID.
          schema:
            type: string
            pattern: "^[A-Za-z0-9._-]{1,64}$"
      responses:
        "200":
          description: The hardware document.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hardware"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      summary: List tasks
      x-skep-permission: task:read
      description: |
        Returns tasks newest first. Entries are summaries: `result` is only
        returned by the single-task endpoint.

        Collections are paginated with a cursor. Pass the `next_cursor` of
        one page as `cursor` to get the next; it is absent on the last page.
      parameters:
        - $ref: "#/components/parameters/Background"
        - name: status
          in: query
          description: Only return tasks in this status.
          schema:
            $ref: "#/components/schemas/TaskStatus"
        - name: limit
          in: query
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          description: The `next_cursor` of the previous page.
          schema:
            type: string
      responses:
        "200":
          description: One page of tasks.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /tasks/{id}:
    get:
      tags: [tasks]
      operationId: getTask
      summary: One task with its event history
      description: |
        A finished task is deleted, with its events, once it is older than
        the agent's task retention (90 days by default); the newest
        finished task of each resource is kept. After that this endpoint
        answers `404`, and what the task did remains in the agent's audit
        log.
      x-skep-permission: task:read
      parameters:
        - $ref: "#/components/parameters/Background"
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9._-]{1,64}$"
      responses:
        "200":
          description: The task and its events, oldest first.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /tasks/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [tasks]
      operationId: cancelTask
      summary: Cancel a task
      x-skep-permission: task:cancel
      description: |
        Requires `task:cancel`. Asks the agent to cancel a task and returns
        the task as it is after the request. The request has no body.

        A pending task becomes `cancelled` at once. A running task has the
        request recorded (`cancel_requested_at`) and becomes `cancelled`
        when it stops; read the task again to see the outcome. A finished
        task is returned unchanged. Cancellation is cooperative and rolls
        nothing back.

        The agent records the caller as the actor of the cancellation in
        its operation audit log; the request ID links that entry to the
        access audit log.
      responses:
        "200":
          description: The task after the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A running task of this type cannot be cancelled (`not_cancellable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/Unavailable"
  /users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List users
      description: Requires `user:read`.
      responses:
        "200":
          description: Every user, ordered by username.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [users]
      operationId: createUser
      summary: Create a user
      description: Requires `user:manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewUser"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The username is taken (`username_taken`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [users]
      operationId: getUser
      summary: Get a user
      description: Requires `user:read`.
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [users]
      operationId: updateUser
      summary: Change a user
      description: |
        Requires `user:manage`. Fields that are left out are not changed.
        A change of role, disabling, and a new password end all of the
        user's sessions. The only enabled administrator cannot be disabled
        or given another role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: The user after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LastAdmin"
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Delete a user
      description: |
        Requires `user:manage`. Ends the user's sessions. The only enabled
        administrator cannot be deleted. Audit entries about the user are
        kept.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LastAdmin"
  /roles:
    get:
      tags: [users]
      operationId: listRoles
      summary: List roles
      description: Requires `role:read`. Roles cannot be edited through the API in this release.
      responses:
        "200":
          description: Every role with its permissions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /audit:
    get:
      tags: [users]
      operationId: listAudit
      summary: Read the access audit log
      description: |
        Requires `audit:read`. Returns authentication events, authorization
        denials, and administrative changes, newest first. An entry is
        never changed. Entries are served from the live table: by default
        they are removed from it 90 days after the end of their month,
        once they are in a sealed archive segment, and are then read on
        the host with `skep-api audit export`. The log never contains
        passwords, session tokens, or their hashes. Operations performed
        on the host are recorded separately by the agent.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: cursor
          in: query
          description: The `next_cursor` of the previous page.
          schema:
            type: string
      responses:
        "200":
          description: One page of entries.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEntry"
                  next_cursor:
                    type: string
                    description: Empty or absent on the last page.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /vms:
    get:
      tags: [vms]
      operationId: listVMs
      summary: List virtual machines
      x-skep-permission: vm:read
      description: |
        Requires `vm:read`. Returns VMs ordered by name, cursor paginated
        like tasks. Each VM carries what was asked for (`desired_state`,
        the configuration) and what the agent last observed (`observed`),
        never mixed in one field.
      parameters:
        - $ref: "#/components/parameters/Background"
        - name: state
          in: query
          description: Only return VMs in this observed state.
          schema:
            $ref: "#/components/schemas/VMState"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: One page of VMs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VMList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [vms]
      operationId: createVM
      summary: Create a virtual machine
      x-skep-permission: vm:write
      description: |
        Requires `vm:write`. Validates the request against the engine and
        the host confinement, reserves the VM's name, and submits a
        `vm.create` task that creates its datasets and zvols. The VM
        exists, with `provisioned: false`, as soon as this returns; it can
        be started once the task has succeeded.

        Sizes are a number of bytes or a string with a binary suffix
        (`"512M"`, `"8G"`). Disks and network interfaces are fixed at
        creation. A disk reserves its full size unless `thin` is true.

        Refusals that need the host to decide (`pool_not_allowed`,
        `bridge_not_allowed`, `engine_unsupported`, `firmware_unsupported`,
        `insufficient_space`, `media_not_found`, `vm_mac_in_use`) create
        no task and are audited. An `Idempotency-Key` header makes a retry
        return the first answer.

        A NIC's `mac_address` that another Skep VM or a Skep jail already
        holds is refused with `vm_mac_in_use` (409); its details name the
        holder (`held_by_kind` `vm` or `container`, `held_by_id`,
        `held_by_name`) and the NIC (`slot`, `mac_address`), as
        `container_mac_in_use` does for a jail.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VMCreate"
      responses:
        "202":
          description: The VM, not yet provisioned, and the task that provisions it.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VMCreated"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/VMConflict"
        "422":
          $ref: "#/components/responses/VMUnprocessable"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "503":
          $ref: "#/components/responses/Unavailable"
  /vms/{id}:
    parameters:
      - $ref: "#/components/parameters/VMID"
    get:
      tags: [vms]
      operationId: getVM
      summary: One virtual machine
      x-skep-permission: vm:read
      description: Requires `vm:read`.
      parameters:
        - $ref: "#/components/parameters/Background"
      responses:
        "200":
          description: The VM with its disks, install media, and network interfaces.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      tags: [vms]
      operationId: updateVM
      summary: Change a stopped virtual machine
      x-skep-permission: vm:write
      description: |
        Requires `vm:write`. Submits a `vm.update` task. Fields left out
        are unchanged. Only a stopped, provisioned VM can be changed
        (`vm_not_stopped`, `vm_not_provisioned`). `media` replaces the
        attached install media; `[]` detaches all of it.

        Disks (ADR 0010 decision 4): `add_disks` adds zvol-backed disks
        with the rules of a create, each in the lowest free slot.
        `resize_disks` grows a disk; a disk never shrinks, and the guest
        grows its own partition and filesystem afterwards (the task result
        says so). A disk with a reservation needs the growth to be
        available in its pool (`insufficient_space`). `remove_disks`
        destroys the disks in those slots and their zvols, and **needs
        `vm:delete` as well**. It is refused while snapshots contain the
        disk (`disk_has_snapshots`, naming them) unless
        `"destroy_snapshots": true`, which destroys each such snapshot
        whole, on every disk of the VM; snapshots taken before the disk
        was added are kept. A snapshot with linked clones blocks the
        removal whatever the flag says (`snapshot_has_clones`). The task
        result and the audit entry list every dataset and snapshot
        destroyed. Changing a disk's bus, block size, or reservation is
        not offered, and nothing is hot-plugged.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VMUpdate"
      responses:
        "202":
          description: The task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VMConflict"
        "422":
          $ref: "#/components/responses/VMUnprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      tags: [vms]
      operationId: deleteVM
      summary: Delete a stopped virtual machine and its disks
      x-skep-permission: vm:delete
      description: |
        Requires `vm:delete`. Submits a `vm.delete` task that destroys the
        VM's datasets recursively, its persistent state, and its rows. The
        VM must be stopped (`vm_not_stopped`). Install media files are
        never touched. The finished audit entry lists every dataset
        destroyed and its size.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: The task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VMConflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /vms/{id}/actions:
    parameters:
      - $ref: "#/components/parameters/VMID"
    post:
      tags: [vms]
      operationId: vmAction
      summary: Start, stop, force-stop, or restart a virtual machine
      x-skep-permission: vm:power
      description: |
        Requires `vm:power`. Submits the task the action becomes:
        `vm.start`, `vm.stop`, `vm.force_stop`, or `vm.restart`.

        - `start` sets `desired_state` to `running`, starts the VM's runner,
          and succeeds once the guest runs. Refused when bhyve is not
          available (`bhyve_unavailable`), when the running VMs and this
          one would exceed physical memory less the configured reserve
          (`insufficient_memory`), when the bridge holds a management
          interface (`bridge_not_allowed`), or, for a VM with a NIC, when
          the netgraph modules of the anti-spoofing filters are not loaded
          (`port_filter_unavailable`, ADR 0011). Every tap gets its filter
          before it joins the bridge; if that fails, the run ends `failed`
          with `port_filter_failed` in the detail and the task fails with
          `vm_start_failed`. Before the runner starts, the device node of
          every zvol disk must exist; a missing one is repaired by setting
          `volmode` to `none` and back to `dev`, and when that is not
          possible or not allowed the task fails with
          `disk_device_missing`, whose details name the `dataset`, the
          `reason`, and, when an administrator has to act, the `command`
          (ADR 0010 amendment z).
        - `stop` sets `desired_state` to `stopped` and presses the guest's
          ACPI power button. It waits `timeout` seconds (default 90, at
          most 300); if the guest has not shut down by then the task fails
          with `stop_timeout` and the VM keeps running. A stop never
          escalates to a force stop.
        - `force_stop` powers the guest off at once and destroys whatever
          is left of the VM on the host.
        - `restart` is a stop followed by a start, in one task.

        Nothing restarts a VM by itself: a guest that powers off leaves
        `desired_state` at `running` and `drift` true.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VMAction"
      responses:
        "202":
          description: The task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VMConflict"
        "422":
          $ref: "#/components/responses/VMUnprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /vms/{id}/snapshots:
    parameters:
      - $ref: "#/components/parameters/VMID"
    get:
      tags: [vms]
      operationId: listSnapshots
      summary: A VM's snapshots
      x-skep-permission: vm:read
      description: |
        Requires `vm:read`. The VM's snapshots, oldest first, with what
        ZFS shows of each now (`observed`) and the linked clones that
        depend on each.
      parameters:
        - $ref: "#/components/parameters/Background"
      responses:
        "200":
          description: The snapshots.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [vms]
      operationId: createSnapshot
      summary: Take a snapshot of a VM's disks
      x-skep-permission: vm:snapshot
      description: |
        Requires `vm:snapshot`. Submits `vm.snapshot.create`, which takes
        one atomic recursive ZFS snapshot of every disk of the VM and
        copies its UEFI variable store (ADR 0010 decision 2). Memory is
        not saved. Taken while the VM runs, the snapshot is
        `crash_consistent`: what a power cut would leave on disk; taken
        while it is stopped, `consistent`. The task can be cancelled until
        the ZFS call.

        Refused for a VM with no disks or with disks in more than one pool
        (`storage_feature_unsupported`: ZFS snapshots are atomic within a
        pool only), for a name the VM already uses
        (`snapshot_name_taken`), beyond
        `storage.max_snapshots_per_resource` (`snapshot_limit`, default
        64), and when the encryption key of the VM's datasets is not
        loaded (`storage_locked`).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SnapshotCreate"
      responses:
        "202":
          description: The snapshot, not yet taken, and its task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotCreated"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VMConflict"
        "422":
          $ref: "#/components/responses/VMUnprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /vms/{id}/snapshots/{sid}:
    parameters:
      - $ref: "#/components/parameters/VMID"
      - $ref: "#/components/parameters/SnapshotID"
    get:
      tags: [vms]
      operationId: getSnapshot
      summary: One snapshot
      x-skep-permission: vm:read
      parameters:
        - $ref: "#/components/parameters/Background"
      responses:
        "200":
          description: The snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snapshot"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      tags: [vms]
      operationId: deleteSnapshot
      summary: Delete a snapshot
      x-skep-permission: vm:snapshot
      description: |
        Requires `vm:snapshot`. Submits `vm.snapshot.delete`, which
        destroys the snapshot on every disk of the VM and its copy of the
        variable store. The VM may be running. Refused while a linked clone
        depends on the snapshot (`snapshot_has_clones`, naming the
        clones).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: The task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VMConflict"
        "422":
          $ref: "#/components/responses/VMUnprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /vms/{id}/snapshots/{sid}/rollback:
    parameters:
      - $ref: "#/components/parameters/VMID"
      - $ref: "#/components/parameters/SnapshotID"
    post:
      tags: [vms]
      operationId: rollbackSnapshot
      summary: Roll a VM back to a snapshot
      x-skep-permission: vm:snapshot
      description: |
        Requires `vm:snapshot`. Submits `vm.snapshot.rollback`, which
        rolls every disk of the VM back and restores the variable store
        copied with the snapshot. Only while the VM is stopped
        (`vm_not_stopped`): a rollback never hides a power-off.

        A rollback to a snapshot that is not the latest destroys every
        newer one, and is refused without `"destroy_newer": true`
        (`snapshot_not_latest`, listing them). The task result and the
        audit entry name each snapshot destroyed. A newer snapshot with
        linked clones refuses the rollback whatever the flag says
        (`snapshot_has_clones`), and so does a newer snapshot Skep did not
        take. A snapshot taken before a disk was added is refused
        (`snapshot_incomplete`): rolling back to it would give the VM a
        disk with contents from after the snapshot.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SnapshotRollback"
      responses:
        "202":
          description: The task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VMConflict"
        "422":
          $ref: "#/components/responses/VMUnprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /vms/{id}/clone:
    parameters:
      - $ref: "#/components/parameters/VMID"
    post:
      tags: [vms]
      operationId: cloneVM
      summary: Make a linked clone of a VM
      x-skep-permission: vm:write
      x-skep-also-requires: [vm:snapshot]
      description: |
        Requires `vm:write` and `vm:snapshot`. Submits `vm.clone`, which
        makes a new VM whose disks are ZFS clones of one snapshot of the
        source (ADR 0010 decision 3). Without `snapshot_id`, the task
        takes a snapshot of the source first, named after the clone, and
        leaves it behind. The clone gets a new ID (and so SMBIOS UUID),
        the given name, and new MAC addresses; it has the source's CPU,
        memory, and NICs, its disks are thin, and install media is not
        attached.

        **A clone is the same guest.** Skep does not change what is inside
        the disks: the guest's hostname, its SSH host keys, and its
        machine ID (`/etc/hostid`, `/etc/machine-id`, the Windows SID) are
        the source's. Change them in the clone before it shares a network
        with the source.

        While the clone exists, its origin snapshot and the source VM
        cannot be deleted (`snapshot_has_clones`). Clones stay in the
        source's pool.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VMClone"
      responses:
        "202":
          description: The clone, not yet provisioned, and its task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VMCreated"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VMConflict"
        "422":
          $ref: "#/components/responses/VMUnprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /vms/{id}/console/serial:
    parameters:
      - $ref: "#/components/parameters/VMID"
    get:
      tags: [vms]
      operationId: vmSerialConsole
      summary: The serial console of a running VM (WebSocket)
      x-skep-permission: vm:console
      description: |
        Requires `vm:console`: a console is a login on the guest. Upgrades
        to a WebSocket (`Connection: Upgrade`, `Upgrade: websocket`);
        OpenAPI cannot describe the stream itself. A browser authenticates
        with its session cookie and must send a matching `Origin`; other
        clients send `Authorization: Bearer`.

        Messages are binary in both directions: the guest's output, and
        keystrokes for the guest. No terminal emulation happens on the
        server. On attach the client first receives up to 64 KiB of the
        output the agent kept since the VM started.

        At most 4 clients attach to one console; a fifth is refused with
        `409 console_busy`, and a VM that is not running with
        `409 vm_not_running`, both before the upgrade.

        A console does not outlive its session: it is re-checked once a
        minute, and when the session has ended, expired, or been revoked
        the WebSocket closes with code 4001. Keystrokes count as use of
        the session (at most once a minute); output from the guest does
        not, so an unattended console idles out. At the same check, a
        console the quorum gate would now refuse to open (the node has no
        quorum, or the session is degraded) closes with code 4002 and a
        reason the client can show, recorded as `request.no_quorum`.

        Attachment and detachment are recorded in the access audit log and
        in the agent's operation audit log (`vm.console.attach`,
        `vm.console.detach`), linked by the request ID.
      responses:
        "101":
          description: Switching to the WebSocket protocol.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VMConflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /storage/pools:
    get:
      tags: [storage]
      operationId: listStoragePools
      summary: The pools VMs may use
      x-skep-permission: storage:read
      description: |
        Requires `storage:read`. The pools in the agent's allow-list
        (`storage.pools` in `agent.json`), as observed now. A pool that
        cannot be read is listed with health `UNAVAILABLE` and an `error`.
      parameters:
        - $ref: "#/components/parameters/Background"
      responses:
        "200":
          description: The allow-listed pools.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoragePoolList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /storage/datasets:
    get:
      tags: [storage]
      operationId: listStorageDatasets
      summary: What Skep owns in its pools
      x-skep-permission: storage:read
      description: |
        Requires `storage:read`. Every filesystem, volume, and snapshot
        under `<pool>/<root>` of the allow-listed pools, ordered by pool
        (in allow-list order) and name, cursor paginated, read from ZFS on
        each request. Each entry names its owner: a VM, a jail, a
        template, `skep` for the datasets that only hold others, or
        `unowned` with a reason. A dataset is owned only when its place in
        the tree, its `skep:` owner property, and the agent's database
        agree; anything else (an interrupted create, a hand-made dataset,
        a snapshot Skep did not take) is listed as unowned and never
        removed automatically (ADR 0010 decision 1). Encryption,
        compression, and key status are what the operator set and Skep
        inherits (decision 5). A pool that cannot be read is named in
        `unavailable_pools` instead of failing the list. Directory pools
        have no datasets and are not listed; naming one in `pool` is
        `storage_feature_unsupported`.
      parameters:
        - $ref: "#/components/parameters/Background"
        - name: pool
          in: query
          description: Only list this allow-listed pool.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: One page of the inventory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/VMConflict"
        "422":
          $ref: "#/components/responses/VMUnprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /storage/template-sources:
    get:
      tags: [storage]
      operationId: getTemplateSources
      summary: What this host can build jail templates from
      x-skep-permission: storage:read
      description: |
        Requires `storage:read`. The host kernel's release
        (`freebsd-version -k`) and whether each template source can be
        used, with the reason when not (ADR 0010 decision 7). `pkgbase`
        needs the host's pkg, a non-empty `storage.template_packages`, and
        a compiled package-script allowlist for the host's major.minor;
        `dist` needs `base.txz` and `MANIFEST` in `storage.dist_dir`.
      parameters:
        - $ref: "#/components/parameters/Background"
      responses:
        "200":
          description: The template sources of this host.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateSources"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /storage/templates:
    get:
      tags: [storage]
      operationId: listTemplates
      summary: Jail templates
      x-skep-permission: storage:read
      description: |
        Requires `storage:read`. Templates by name, cursor paginated. Each
        shows the release it was built with, the host's release now, and
        `patch_differs` when the two share major.minor but not the patch
        level (ADR 0010 step 6, item 6).
      parameters:
        - $ref: "#/components/parameters/Background"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: One page of templates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [storage]
      operationId: createTemplate
      summary: Build a jail template
      x-skep-permission: storage:write
      description: |
        Requires `storage:write` (admin only: the root agent fetches and
        installs packages). Submits `container.template.create`
        (cancellable, 30 minutes), which builds the userland into
        `<pool>/<root>/templates/<id>` and snapshots it as `@skep-base`.
        The request names no package, URL, or path: the packages are
        `storage.template_packages`, the archive is `base.txz` in
        `storage.dist_dir`.

        A `pkgbase` build runs pkg with package scripts and triggers off
        and a fixed environment; checks every package script and trigger
        file against Skep's compiled allowlist for the release
        (`template_script_unknown`, with the script's text); checks that
        the userland has the host's major.minor (`release_unsupported`);
        runs the scripts' known commands in a throwaway build jail with no
        network and every `allow.*` off; fails if pkg left a deferred
        trigger (`template_trigger_left`); and compares every file under
        the host's `/etc`, `/var/db/pkg`, and `/usr/share/certs` before
        and after (`template_host_changed`, with the paths). A command that
        fails is `template_build_failed` with its first line of stderr. Any
        failure, cancel, or timeout removes the build jail and destroys the
        template. Templates are built in ZFS pools only in this release.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateCreate"
