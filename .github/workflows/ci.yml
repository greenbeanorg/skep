name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A full run on demand, whatever the change touches.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the run it replaces. Runs
# on main are never cancelled: every merged commit keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether the change can affect anything the other jobs check.
  # A change that touches only documentation or recorded test results
  # (the paths in the base's scripts/ci-docs-only.sh) skips them. Any doubt (an
  # unknown base, a failure here) runs everything: the jobs below skip only
  # when this job says "false" explicitly.
  changes:
    name: Code or docs only
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        # The decision is made by the base's copy of the script, never the
        # copy this change carries. No such file in the base means "code".
        # --no-renames lists both names of a move: code moved under docs/
        # must not look like a docs-only change.
        run: |
          case "$EVENT" in
          pull_request) base="$PR_BASE"; range="$PR_BASE...$PR_HEAD" ;;
          push) base="$PUSH_BEFORE"; range="$PUSH_BEFORE..$PUSH_AFTER" ;;
          *) base=""; range="" ;;
          esac
          decider="$(mktemp)"
          if [ -n "$range" ] &&
             git show "$base:scripts/ci-docs-only.sh" > "$decider" 2>/dev/null &&
             files="$(git diff --no-renames --name-only "$range")" &&
             printf '%s\n' "$files" | sh "$decider"; then
            echo "only documentation or results changed; the checks are skipped"
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
          rm -f "$decider"

  go:
    name: Test, vet, build
    needs: changes
    # A skipped job counts as passed for a required status check, so a
    # docs-only pull request is never blocked by it. "!cancelled()" runs the
    # job even when "changes" failed (its output is then empty, not "false").
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify dependencies
        run: |
          go mod download
          go mod verify
          go mod tidy -diff

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet (Linux)
        run: go vet ./...

      - name: Vet (FreeBSD amd64)
        run: GOOS=freebsd GOARCH=amd64 go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      # The test-only task types are compiled only with this tag and never
      # ship; they still have to build and pass.
      - name: Test (test-only task types)
        run: |
          go vet -tags skep_testtasks ./cmd/...
          go test -race -count=1 -tags skep_testtasks ./cmd/...

      # Without the web interface (build tag skep_webui): the Go build must
      # not need Node.js. The "release" job builds the binaries with it.
      - name: Build (Linux, development only)
        run: make build-go

      # Cross-compilation proves the FreeBSD build compiles. It does not
      # prove runtime behaviour; that is validated on a real FreeBSD host.
      - name: Cross-compile (FreeBSD amd64)
        run: |
          make build-freebsd-go
          make build-freebsd-test
          # The shipped agent must not contain the test-only task type.
          if grep -q 'test\.sleep' bin/freebsd-amd64/skep-agent; then
            echo "the shipped agent contains the test-only task type"
            exit 1
          fi
          # Nor the in-memory fake of the privileged host operations
          # (ADR 0009 decision 1b): a FreeBSD agent has only the real ones.
          for b in bin/freebsd-amd64/skep-agent bin/freebsd-amd64-test/skep-agent-testbuild; do
            if grep -a -q 'skep-hostfake' "$b"; then
              echo "$b contains the simulated host operations"
              exit 1
            fi
          done
          if ! grep -a -q 'skep-hostfake' bin/skep-agent; then
            echo "the development agent does not contain the simulated host operations"
            exit 1
          fi

      - name: Static analysis
        run: |
          # Install a native binary first: "GOOS=freebsd go run" would build
          # staticcheck itself for FreeBSD and fail to execute it here.
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
          GOOS=freebsd GOARCH=amd64 staticcheck ./...

      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  web:
    name: Web interface
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # web/.node-version names the Node.js major the interface is built
      # and tested with on the development machine.
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # src/api/schema.d.ts is generated from api/openapi.yaml; a change
      # to the API without regenerating fails here.
      - name: Check the generated API types
        run: npm run check-types

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # The release binaries: the web interface built and embedded in skep-api
  # (ADR 0008, decision 4). Checks that the FreeBSD binary carries the
  # interface and not the placeholder page.
  release:
    name: Release build with the web interface
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the web interface's dependencies
        run: make web-install

      # THIRD_PARTY_NOTICES lists every Go module linked into the shipped
      # binaries and every npm package in the built interface, with their
      # licenses; a dependency change without "make notices" fails here.
      - name: Third-party notices are current
        run: make notices-check

      - name: Vet and test with the interface embedded
        run: |
          make web-build
          go vet -tags skep_webui ./...
          go test -count=1 -tags skep_webui ./internal/webui/ ./cmd/skep-api/

      - name: Build (Linux) and cross-compile (FreeBSD amd64) with the interface
        run: |
          make build
          make build-freebsd

      # The browser tests drive a real skep-api with the interface embedded
      # and the agent's test build (scripts/e2e-stack.sh), trusting it by
      # its key pin (scripts/web-e2e.sh; ADR 0010 amendment x).
      - name: Install Playwright's browser
        run: cd web && npx playwright install --with-deps chromium

      - name: Browser tests
        run: ./scripts/web-e2e.sh

      - name: Upload the browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

      - name: The FreeBSD skep-api carries the interface, not the placeholder
        run: |
          if grep -a -q 'skep-webui-placeholder' bin/freebsd-amd64/skep-api; then
            echo "the FreeBSD skep-api contains the placeholder page"
            exit 1
          fi
          if ! grep -a -q 'src="/theme.js"' bin/freebsd-amd64/skep-api; then
            echo "the FreeBSD skep-api does not contain the built interface"
            exit 1
          fi
          # The other binaries never embed it.
          for b in skep-agent skepctl skep-setup; do
            if grep -a -q 'src="/theme.js"' bin/freebsd-amd64/$b; then
              echo "$b contains the web interface"
              exit 1
            fi
          done
