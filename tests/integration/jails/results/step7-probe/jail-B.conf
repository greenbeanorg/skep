skep-probe7 {
	path = "/skeptest/step7-probe/root";
	host.hostname = "probe7";
	vnet;
	persist;
	enforce_statfs = 2;
	children.max = 0;
	securelevel = 2;
	mount.devfs;
	devfs_ruleset = 5;
	 allow.adjtime = 0; allow.chflags = 0; allow.extattr = 0; allow.mlock = 0; allow.mount = 0; allow.nfsd = 0; allow.quotas = 0; allow.raw_sockets = 0; allow.read_msgbuf = 0; allow.reserved_ports = 0; allow.routing = 0; allow.set_hostname = 0; allow.setaudit = 0; allow.settime = 0; allow.socket_af = 0; allow.sysvipc = 0; allow.unprivileged_parent_tampering = 0; allow.unprivileged_proc_debug = 0;
	allow.suser = 1;
	allow.reserved_ports = 1;
	exec.clean;
	exec.start = "/bin/sh /etc/rc";
	exec.stop = "/bin/sh /etc/rc.shutdown jail";
	exec.consolelog = "/skeptest/step7-probe/console-B.log";
	exec.timeout = 60;
	stop.timeout = 10;
}
