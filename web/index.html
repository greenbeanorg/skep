<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Skep</title>
    <!--
      Applies the stored theme before the first paint. It is a file, not an
      inline script, because skep-api serves the interface with a
      Content-Security-Policy that allows no inline script (ADR 0008).
    -->
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
