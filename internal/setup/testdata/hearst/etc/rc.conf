# hearst's settings as read with sysrc -a on 2026-11-22 (read-only)
hostname="hearst.greenbean.org"
ifconfig_vtnet0="inet 10.79.20.170 netmask 255.255.255.0"
defaultrouter="10.79.20.1"
ifconfig_vtnet1="up"
cloned_interfaces="bridge0"
ifconfig_bridge0="addm vtnet1 up"
sshd_enable="YES"
ntpd_enable="YES"
ntpd_sync_on_start="YES"
powerd_enable="YES"
moused_nondefault_enable="NO"
dumpdev="AUTO"
zfs_enable="YES"
qemu_guest_agent_enable="YES"
skep_agent_enable="YES"
skep_api_enable="YES"
skep_api_args="-listen 10.79.20.170:8443"
